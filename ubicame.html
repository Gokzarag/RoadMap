<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - Ubícame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root{
      --sidebar-accent:#f9735b;
      --sidebar-accent-soft:#fde3dd;
      --main-bg:#f4f5f7;
      --card-bg:#ffffff;
      --border-soft:#e5e7eb;
      --text-main:#111827;
      --text-muted:#6b7280;
      --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      --content-max:1120px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font);
      background:var(--main-bg);
      color:var(--text-main);
      min-height:100vh;
      margin:0;
    }
    .layout{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    .main{
      flex:1;
      padding:72px 16px 16px;
      display:flex;
      justify-content:center;
    }
    .main-inner{
      width:100%;
      max-width:var(--content-max);
      display:flex;
      flex-direction:column;
    }

    /* Header (sidebar.html) */
    .rm-header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:40;
      display:flex;
      justify-content:center;
      padding:10px 0;
      background:#020617;
      color:#f9fafb;
      border-bottom:1px solid rgba(148,163,184,0.4);
    }
    .rm-header-inner{
      width:100%;
      max-width:var(--content-max);
      padding:0 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .rm-header-left{display:flex;align-items:center;gap:8px;}
    .rm-logo{
      width:26px;height:26px;border-radius:8px;
      border:1px solid rgba(249,250,251,0.3);
    }
    .rm-title{display:flex;flex-direction:column;}
    .rm-title span:first-child{
      font-size:10px;text-transform:uppercase;
      letter-spacing:0.12em;color:#9ca3af;
    }
    .rm-title span:last-child{
      font-size:13px;font-weight:600;
    }
    .rm-header-center{
      display:flex;flex-direction:column;align-items:center;gap:2px;
    }
    .rm-label{
      font-size:10px;text-transform:uppercase;color:#9ca3af;
    }
    .rm-zona{display:flex;gap:4px;}
    .zona-pill{
      border-radius:999px;
      padding:3px 8px;
      font-size:11px;
      border:1px solid rgba(249,250,251,0.16);
      background:#0f172a;
      color:#e5e7eb;
      cursor:pointer;
      white-space:nowrap;
    }
    .zona-pill.active{
      background:#f9735b;
      color:#111827;
    }
    .rm-header-right .btn-menu{
      background:none;
      border:1px solid rgba(249,250,251,0.4);
      color:#f9fafb;
      border-radius:6px;
      padding:3px 8px;
      font-size:16px;
      cursor:pointer;
    }

    .menu-popup{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,0.6);
      display:flex;
      justify-content:flex-start;
      align-items:stretch;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      z-index:40;
    }
    .menu-popup.open{
      opacity:1;
      pointer-events:auto;
    }
    .menu-popup-inner{
      width:240px;
      max-width:80%;
      background:#020617;
      color:#f9fafb;
      padding:14px 12px 16px;
      box-shadow:0 8px 30px rgba(0,0,0,0.5);
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .menu-popup-close{
      align-self:flex-end;
      background:none;
      border:none;
      color:#e5e7eb;
      font-size:18px;
      cursor:pointer;
      margin-bottom:4px;
    }
    .menu-popup-title{
      font-size:13px;
      margin-bottom:4px;
    }
    .menu-popup-nav a{
      display:block;
      padding:5px 4px;
      color:#e5e7eb;
      text-decoration:none;
      border-radius:6px;
      font-size:13px;
    }
    .menu-popup-nav a:hover{
      background:rgba(148,163,184,0.25);
    }

    @media(max-width:900px){
      .rm-header-inner{flex-wrap:wrap;}
      .rm-header-center{
        order:3;width:100%;align-items:flex-start;
      }
    }

    /* Panel Ubícame */
    .panel{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
      background:var(--card-bg);
      border-radius:14px;
      padding:18px 20px 20px;
      border:1px solid var(--border-soft);
      box-shadow:0 6px 20px rgba(15,23,42,0.08);
      min-height:0;
    }
    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
    }
    .panel-title h1{
      font-size:18px;
      margin-bottom:4px;
    }
    .panel-title p{
      font-size:13px;
      color:var(--text-muted);
    }
    .panel-meta{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:4px;
      font-size:11px;
    }
    .badge-zona-main{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      background:var(--sidebar-accent-soft);
      color:#7c2d12;
      border:1px solid #fed7c2;
      display:inline-flex;
      align-items:center;
      gap:4px;
    }

    .buscador-box{
      display:flex;
      flex-direction:row;
      flex-wrap:wrap;
      align-items:flex-end;
      gap:8px 12px;
      margin-top:10px;
      padding:10px 10px 10px;
      border-radius:10px;
      border:1px solid var(--border-soft);
      background:#f9fafb;
    }
    .buscador-box label{
      flex-basis:100%;
      font-size:12px;
      font-weight:600;
      color:var(--text-muted);
    }
    #codigoClienteInput{
      padding:6px 9px;
      border-radius:7px;
      border:1px solid #d1d5db;
      font-size:12px;
      width:160px;
    }
    #buscarClienteBtn{
      padding:6px 12px;
      border-radius:999px;
      border:none;
      background:var(--sidebar-accent);
      color:#111827;
      font-size:12px;
      font-weight:600;
      cursor:pointer;
    }
    #buscarClienteBtn:hover{opacity:.9;}
    #resultadoCliente{
      flex-basis:100%;
      margin-top:4px;
      padding:8px 9px;
      border-radius:7px;
      font-size:12px;
      display:none;
    }
    #resultadoCliente.exito{
      background:#dcfce7;
      color:#15803d;
      border:1px solid #bbf7d0;
    }
    #resultadoCliente.error{
      background:#fee2e2;
      color:#b91c1c;
      border:1px solid #fecaca;
    }

    .map-wrapper{
      flex:1;
      margin-top:6px;
      border-radius:10px;
      overflow:hidden;
      border:1px solid var(--border-soft);
      background:#e5e7eb;
      box-shadow:inset 0 0 6px rgba(15,23,42,0.18);
      display:flex;
      min-height:0;
    }
    #ubicame-map{
      flex:1;
      width:100%;
      height:100%;
      min-height:0;
    }

    @media(max-width:900px){
      .main{padding:10px 10px 14px;}
      .panel{padding:14px 14px 16px;}
      .map-wrapper{min-height:70vh;}
    }
    @media(max-width:480px){
      .panel-title h1{font-size:16px;}
      .panel-title p{font-size:12px;}
    }
  </style>
</head>
<body>
<div class="layout">
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="main-inner">
      <section class="panel">
        <header class="panel-header">
          <div class="panel-title">
            <h1>Ubicar cliente Sigma</h1>
            <p>Ingresa el código (deudor Sigma) y visualiza su ubicación con acceso directo a Google Maps.</p>
            <div class="buscador-box">
              <label for="codigoClienteInput">Código de Cliente (Deudor Sigma):</label>
              <input type="text" id="codigoClienteInput" placeholder="Ej: 123456" autocomplete="off" spellcheck="false" />
              <button id="buscarClienteBtn" onclick="buscarClienteSigma()">🔍 Ubicar cliente</button>
              <div id="resultadoCliente"></div>
            </div>
          </div>
          <div class="panel-meta">
            <span class="badge-zona-main">Zona activa: <strong id="badge-zona-text">-</strong></span>
          </div>
        </header>

        <div class="map-wrapper">
          <div id="ubicame-map"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- Zona activa -->
<script>
function getZona(){
  return localStorage.getItem('maptrack_zona') || '0752';
}
function setZona(z){
  localStorage.setItem('maptrack_zona', z);
  pintarZona();
}
function pintarZona(){
  const z = getZona();
  const label = (z === '0752' ? 'Cadi Chorrillos' : 'Cedi Ate');
  const badge = document.getElementById('badge-zona-text');
  if (badge) badge.textContent = label;
}
</script>

<script>
const SIGMA_CSV_URL = 'https://raw.githubusercontent.com/Gokzarag/MapTrack/main/Catalogo%20Sigma.csv';
let sigmaData = [];
let ubicameMap = null;
let ubicameMarker = null;
let ubicameUserMarker = null;

function makeCustomMarker(color){
  const svg=encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="21" viewBox="0 0 20 29">
      <path d="M10 0C4.5 0 0 4.6 0 10.2 0 18.4 8.8 28.1 9.2 28.6c.4.5 1.2.5 1.6 0C11.2 28.1 20 18.4 20 10.2 20 4.6 15.5 0 10 0zm0 13.5c-2.1 0-3.7-1.7-3.7-3.7S7.9 6 10 6s3.7 1.7 3.7 3.7-1.7 3.8-3.7 3.8z"
        fill="${color}" stroke="#555" stroke-width="1"/>
    </svg>`);
  return L.icon({iconUrl:"data:image/svg+xml,"+svg,iconSize:[15,21],iconAnchor:[7.5,21],popupAnchor:[0,-16]});
}

function makeBlackDotMarker() {
  const size = 10;
  const svg = encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${size/2 - 1}" fill="black" stroke="white" stroke-width="1"/>
    </svg>`
  );
  return L.icon({
    iconUrl: "data:image/svg+xml," + svg,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
    popupAnchor: [0, -size/2]
  });
}

function showUserLocationOnMap(enable, mapInstance = ubicameMap) {
  if (!mapInstance || !("geolocation" in navigator)) return;

  if (ubicameUserMarker) {
    mapInstance.removeLayer(ubicameUserMarker);
    ubicameUserMarker = null;
  }

  if (!enable) return;

  navigator.geolocation.watchPosition(
    (pos) => {
      const {latitude, longitude} = pos.coords;
      if (ubicameUserMarker) {
        mapInstance.removeLayer(ubicameUserMarker);
      }
      const mk = L.marker([latitude, longitude], {
        icon: makeBlackDotMarker(),
        zIndexOffset: 99999
      }).bindPopup('<div style="font-size:10px;">Mi ubicación actual</div>');
      mk.addTo(mapInstance);
      ubicameUserMarker = mk;
    },
    (err) => {},
    { enableHighAccuracy:true, maximumAge:9000, timeout:10000 }
  );
}

function buscarClienteSigma() {
  const codigo = document.getElementById('codigoClienteInput').value.trim();
  const resultadoDiv = document.getElementById('resultadoCliente');

  if (!codigo) {
    resultadoDiv.textContent = 'Ingresa un código de cliente válido.';
    resultadoDiv.className = 'error';
    resultadoDiv.style.display = 'block';
    return;
  }

  const cliente = sigmaData.find(row => {
    const deudor = (row[0] || '').toString().trim();
    return deudor === codigo;
  });

  if (!cliente) {
    resultadoDiv.textContent = `Cliente ${codigo} no encontrado en el catálogo Sigma.`;
    resultadoDiv.className = 'error';
    resultadoDiv.style.display = 'block';
    if (ubicameMarker) {
      ubicameMap.removeLayer(ubicameMarker);
      ubicameMarker = null;
    }
    return;
  }

  // Formato solicitado
  const codCliente = (cliente[0] || '').toString().trim();
  const nombreBase = cliente[7] || 'N/D';
  const extra1 = (cliente[8] || '').toString().trim();
  const extra2 = (cliente[9] || '').toString().trim();
  let nombreFull = `${codCliente} ${nombreBase}`;
  if (extra1 || extra2){
    const extras = [extra1, extra2].filter(x => x).join(' ');
    nombreFull += ` - ${extras}`;
  }

  const direccion = `${cliente[14] || 'N/D'} - ${cliente[17] || 'N/D'}`;
  const interlocutor = `${cliente[26] || 'N/D'} - ${cliente[46] || 'N/D'}`;
  const ruta = `${cliente[12] || 'N/D'} - ${cliente[21] || 'N/D'}`;
  const diaReparto = cliente[48] || 'N/D';

  const lat = parseFloat(cliente[28]);
  const lng = parseFloat(cliente[29]);

  if (isNaN(lat) || isNaN(lng)) {
    resultadoDiv.textContent = `Cliente ${codigo} no tiene coordenadas válidas.`;
    resultadoDiv.className = 'error';
    resultadoDiv.style.display = 'block';
    return;
  }

  resultadoDiv.innerHTML = `
    <strong>Cliente:</strong> ${nombreFull}<br>
    <strong>Dirección:</strong> ${direccion}<br>
    <strong>Interlocutor:</strong> ${interlocutor}<br>
    <strong>Ruta Venta:</strong> ${ruta}<br>
    <strong>Día reparto:</strong> ${diaReparto}
  `;
  resultadoDiv.className = 'exito';
  resultadoDiv.style.display = 'block';

  mostrarClienteEnMapa(lat, lng, nombreFull, direccion);
}

function mostrarClienteEnMapa(lat, lng, nombre, direccion) {
  if (!ubicameMap) return;

  if (ubicameMarker) {
    ubicameMap.removeLayer(ubicameMarker);
  }

  const gmaps = `https://www.google.com/maps?q=${lat},${lng}`;
  const popupContent = `
    <div style="font-size:11px; line-height:1.3; min-width:220px;">
      <div style="font-weight:bold; color:#e95567; margin-bottom:4px;">👤 ${nombre}</div>
      <div style="color:#374151; margin-bottom:2px;">📍 ${direccion}</div>
      <a href="${gmaps}" target="_blank" rel="noopener" style="color:#075985; font-weight:600; font-size:10px;">🗺️ Abrir en Google Maps</a>
    </div>
  `;

  const mk = L.marker([lat, lng], {
    icon: makeCustomMarker('#e95567')
  }).bindPopup(popupContent);

  mk.addTo(ubicameMap);
  ubicameMarker = mk;
  ubicameMap.setView([lat, lng], 17);
}

function loadSigmaCSV() {
  Papa.parse(SIGMA_CSV_URL, {
    download: true, header: false, skipEmptyLines: true,
    complete: function(results) {
      sigmaData = results.data;
    }
  });
}

document.addEventListener('DOMContentLoaded', ()=>{
  if (typeof loadSidebar === 'function') {
    loadSidebar('ubicame');
  }
  pintarZona();

  ubicameMap = L.map('ubicame-map').setView([-12.1, -77.0], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(ubicameMap);
  showUserLocationOnMap(true, ubicameMap);

  loadSigmaCSV();

  // Enter para buscar
  const input = document.getElementById('codigoClienteInput');
  if (input){
    input.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter'){
        e.preventDefault();
        buscarClienteSigma();
      }
    });
  }
});
</script>

<script src="layout.js"></script>
</body>
</html>
