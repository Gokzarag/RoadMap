<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - Ubícame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" />
  <!-- Copia aquí el mismo bloque <style> de agenda.html -->
</head>
<body>
<div class="layout">
  <!-- Sidebar igual, con Ubícame activo -->
  <aside class="sidebar">
    <!-- ... mismo contenido ... -->
    <div class="sb-section-label">Módulos</div>
    <ul class="menu">
      <li><a href="index.html"><span class="icon">🏠</span><span>Inicio</span></a></li>
      <li><a href="agenda.html"><span class="icon">📅</span><span>Agenda</span></a></li>
      <li><a href="planos.html"><span class="icon">🗺️</span><span>Planos</span></a></li>
      <li><a href="ubicame.html" class="active"><span class="icon">📍</span><span>Ubícame</span></a></li>
      <li><a href="documentos.html"><span class="icon">📄</span><span>Documentos</span></a></li>
    </ul>
    <!-- footer igual -->
  </aside>

  <main class="main">
    <div class="card">
      <div class="card-header">
        <div class="card-header-left">
          <h1>Ubícame</h1>
          <p>Busca un código Sigma y abre la ubicación del cliente en Google Maps.</p>
        </div>
        <div class="badge-zona">
          Zona activa:
          <strong id="badge-zona-text">...</strong>
        </div>
      </div>

      <div class="filters">
        <label style="flex:1;">
          Código Sigma / Cliente
          <input type="text" id="u-sigma" placeholder="Ej. 11599170 o nombre" />
        </label>
        <button style="padding:6px 10px;border-radius:7px;border:1px solid #f9735b;background:#f9735b;color:#111827;font-size:13px;cursor:pointer;margin-top:auto;height:32px;"
                onclick="buscarUbicacion()">
          Buscar
        </button>
      </div>

      <p id="u-result" style="font-size:13px;color:#6b7280;margin-top:6px;">
        Ingresa un código y se mostrará el resumen del cliente con un enlace directo a Maps.
      </p>
    </div>
  </main>
</div>

<script>
  function getZona(){ return localStorage.getItem('maptrack_zona') || '0752'; }
  function setZona(z){ localStorage.setItem('maptrack_zona', z); pintarZona(); }
  function pintarZona(){
    const z = getZona();
    const ate = document.getElementById('zona-ate');
    const ch = document.getElementById('zona-chorr');
    if (ate && ch){
      ate.classList.toggle('active', z === '0374');
      ch.classList.toggle('active', z === '0752');
    }
    const label = z === '0752' ? 'Cadi Chorrillos' : 'Cedi Ate';
    const badge = document.getElementById('badge-zona-text');
    if (badge) badge.textContent = label;
  }

  async function buscarUbicacion(){
    const q = (document.getElementById('u-sigma').value || '').trim();
    const out = document.getElementById('u-result');
    if (!q){
      out.textContent = 'Escribe un código Sigma o parte del nombre del cliente.';
      return;
    }
    out.textContent = 'Buscando en la base de rutas...';
    try {
      const resp = await fetch('https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack_V2.1.csv');
      const text = await resp.text();
      const lines = text.split('
').filter(l => l.trim().length > 0);
      const rows = lines.slice(1).map(l => l.split(';').length > 1 ? l.split(';') : l.split(','));
      // columnas según tu kpi.js: zona=1, veh=2, cliente=3, ruta=6, kg=10, ciudad=14, lat=??, lon=??
      const COL_CLIENTE = 3;
      const COL_CTA = 4;
      const COL_CITY = 14;
      const COL_LAT = 16;
      const COL_LON = 17;
      let found = rows.find(r =>
        (r[COL_CTA] && r[COL_CTA].toString().includes(q)) ||
        (r[COL_CLIENTE] && r[COL_CLIENTE].toUpperCase().includes(q.toUpperCase()))
      );
      if (!found){
        out.textContent = 'No se encontró ningún cliente que coincida con el criterio.';
        return;
      }
      const nombre = (found[COL_CLIENTE] || '').trim();
      const ciudad = (found[COL_CITY] || '').trim();
      const lat = (found[COL_LAT] || '').trim();
      const lon = (found[COL_LON] || '').trim();
      if (lat && lon){
        const url = `https://www.google.com/maps?q=${lat},${lon}`;
        out.innerHTML = `<strong>${nombre}</strong> - ${ciudad}<br/><a href="${url}" target="_blank" rel="noopener">Abrir en Google Maps</a>`;
      } else {
        const query = encodeURIComponent(`${nombre} ${ciudad}`);
        const url = `https://www.google.com/maps/search/?api=1&query=${query}`;
        out.innerHTML = `<strong>${nombre}</strong> - ${ciudad}<br/><a href="${url}" target="_blank" rel="noopener">Buscar en Google Maps</a>`;
      }
    } catch(e){
      out.textContent = 'Error al leer el archivo de rutas.';
    }
  }

  document.addEventListener('DOMContentLoaded', pintarZona);
</script>
</body>
</html>
