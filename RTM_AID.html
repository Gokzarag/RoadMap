<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - RTM AID</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/MapTrack/main/MapTrack.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root{
      --sidebar-accent:#f9735b;
      --sidebar-accent-soft:#fde3dd;
      --main-bg:#f4f5f7;
      --card-bg:#ffffff;
      --border-soft:#e5e7eb;
      --text-main:#111827;
      --text-muted:#6b7280;
      --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      --content-max:1120px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font);
      background:var(--main-bg);
      color:var(--text-main);
      min-height:100vh;
      margin:0;
    }
    .layout{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    .main{
      flex:1;
      padding:72px 8px 8px;
      display:flex;
      justify-content:center;
    }
    .main-inner{
      width:100%;
      max-width:100%;
      display:flex;
      flex-direction:column;
    }

    .rm-header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:40;
      display:flex;
      justify-content:center;
      padding:10px 0;
      background:#020617;
      color:#f9fafb;
      border-bottom:1px solid rgba(148,163,184,0.4);
    }
    .rm-header-inner{
      width:100%;
      max-width:var(--content-max);
      padding:0 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .panel{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:6px;
      background:var(--card-bg);
      border-radius:14px;
      padding:8px 10px 10px;
      border:1px solid var(--border-soft);
      box-shadow:0 6px 20px rgba(15,23,42,0.08);
      min-height:0;
    }

    .panel-header{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      font-size:12px;
    }

    .filtros-rtm{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      width:100%;
      align-items:center;
    }

    .filtro-item{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:150px;
    }
    .filtro-item label{
      font-size:10px;
      font-weight:600;
      color:var(--text-muted);
    }
    .filtro-item select{
      padding:4px 6px;
      border-radius:7px;
      border:1px solid #d1d5db;
      font-size:11px;
      background:white;
    }

    .bloque-mini{
      display:flex;
      align-items:center;
      gap:4px;
      border-radius:999px;
      border:1px dashed #d1d5db;
      padding:4px 8px;
      background:#f9fafb;
      font-size:10px;
      white-space:nowrap;
    }
    .bloque-mini span{
      font-weight:600;
      color:#4b5563;
    }
    .bloque-mini select{
      padding:2px 6px;
      border-radius:999px;
      border:1px solid #d1d5db;
      font-size:10px;
      background:white;
    }

    .toggle-capas{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:10px;
      color:#4b5563;
      white-space:nowrap;
    }
    .toggle-capas label{
      display:flex;
      align-items:center;
      gap:3px;
      cursor:pointer;
    }

    .map-wrapper{
      flex:1;
      border-radius:10px;
      overflow:hidden;
      border:1px solid var(--border-soft);
      background:#e5e7eb;
      box-shadow:inset 0 0 6px rgba(15,23,42,0.18);
      display:flex;
      min-height:0;
      position:relative;
    }
    #rtm-map{
      flex:1;
      width:100%;
      height:78vh;
    }

    .leaflet-popup.rm-dark-popup .leaflet-popup-content-wrapper{
      background:transparent;
      box-shadow:none;
      border-radius:0;
      padding:0;
    }
    .leaflet-popup.rm-dark-popup .leaflet-popup-content{
      margin:0;
    }
    .leaflet-popup.rm-dark-popup .leaflet-popup-tip{
      display:none;
    }

    .info.legend{
      background:rgba(15,23,42,0.95);
      color:#f9fafb;
      padding:6px 8px;
      border-radius:6px;
      font-size:11px;
      line-height:1.4;
      box-shadow:0 4px 10px rgba(15,23,42,0.5);
    }

    @media(max-width:900px){
      .main{padding:66px 6px 6px;}
      #rtm-map{height:75vh;}
    }
    @media(max-width:640px){
      .toggle-capas{width:100%;justify-content:flex-start;margin-left:0;margin-top:4px;}
    }
  </style>
</head>

<body>
<div class="layout">
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="main-inner">
      <section class="panel">
        <header class="panel-header">
          <div class="filtros-rtm">
            <!-- Oficina única -->
            <div class="filtro-item" style="max-width:180px;">
              <label for="filtro-oficina">Oficina</label>
              <select id="filtro-oficina">
                <option value="">Todas</option>
              </select>
            </div>

            <!-- Bloque Puntos -->
            <div class="bloque-mini">
              <span>Puntos</span>
              <select id="filtro-dia-puntos" title="Día puntos">
                <option value="">Día</option>
                <option value="L">Lun</option>
                <option value="M">Mar</option>
                <option value="X">Mié</option>
                <option value="J">Jue</option>
                <option value="V">Vie</option>
                <option value="S">Sáb</option>
                <option value="D">Dom</option>
              </select>
              <select id="filtro-canal-puntos" title="Canal puntos">
                <option value="">Canal</option>
                <option value="DET">DET</option>
                <option value="FSE">FSE</option>
                <option value="MES">MES</option>
                <option value="MOD">MOD</option>
              </select>
            </div>

            <!-- Bloque Coroplético -->
            <div class="bloque-mini">
              <span>Coropléctico</span>
              <select id="filtro-dia-choro" title="Día coroplético">
                <option value="">Día</option>
                <option value="L">Lun</option>
                <option value="M">Mar</option>
                <option value="X">Mié</option>
                <option value="J">Jue</option>
                <option value="V">Vie</option>
                <option value="S">Sáb</option>
                <option value="D">Dom</option>
              </select>
              <select id="filtro-canal-choro" title="Canal coroplético">
                <option value="">Canal</option>
                <option value="DET">DET</option>
                <option value="FSE">FSE</option>
                <option value="MES">MES</option>
                <option value="MOD">MOD</option>
              </select>
            </div>

            <!-- Toggles capas -->
            <div class="toggle-capas">
              <label>
                <input type="checkbox" id="chk-puntos" checked />
                Puntos
              </label>
              <label>
                <input type="checkbox" id="chk-choro" checked />
                Coropléctico
              </label>
            </div>
          </div>
        </header>

        <div class="map-wrapper">
          <div id="rtm-map"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
const SIGMA_CSV_URL = 'https://raw.githubusercontent.com/Gokzarag/MapTrack/main/Catalogo%20Sigma.csv';
const DISTRITOS_GEOJSON_URL = 'https://raw.githubusercontent.com/Gokzarag/RoadMap/main/Distritos.geojson';
const DISTRITO_INDEX = 17;

let sigmaDataRTM = [];
let rtmMap = null;
let rtmMarkersLayer = null;
let rtmChoroplethLayer = null;
let distritosGeoJSON = null;

// panes para orden de dibujo [web:64][web:67]
let paneChoro, panePuntos;

// Colores canal
const canalColors = {
  'DET': '#e11d48',
  'FSE': '#2563eb',
  'MES': '#16a34a',
  'MOD': '#f97316'
};
function getColorByCanal(canal){
  return canalColors[canal] || '#6b7280';
}

function crearLeyendaCanal(mapInstance){
  const legend = L.control({ position:'bottomright' });
  legend.onAdd = function(){
    const div = L.DomUtil.create('div', 'info legend');
    div.innerHTML = '<strong>Canal</strong><br>';
    Object.keys(canalColors).forEach(canal=>{
      const color = canalColors[canal];
      div.innerHTML += `
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px;">
          <span style="display:inline-block;width:10px;height:10px;border-radius:999px;background:${color};"></span>
          <span>${canal}</span>
        </div>
      `;
    });
    return div;
  };
  legend.addTo(mapInstance);
}

function cargarSigmaRTM(){
  Papa.parse(SIGMA_CSV_URL, {
    download:true,
    header:false,
    skipEmptyLines:true,
    complete:function(res){
      sigmaDataRTM = res.data.slice(1);
      prepararFiltrosOficina();
      aplicarFiltrosRTM();
    }
  });
}

function prepararFiltrosOficina(){
  const selectOficina = document.getElementById('filtro-oficina');
  const oficinas = new Set();

  sigmaDataRTM.forEach(row=>{
    const oficina = (row[46] || '').toString().trim();
    if (oficina) oficinas.add(oficina);
  });

  Array.from(oficinas).sort().forEach(of=>{
    const opt = document.createElement('option');
    opt.value = of;
    opt.textContent = of;
    selectOficina.appendChild(opt);
  });
}

// --------- FILTROS ---------
function filtrosComunes(){
  return {
    oficina: document.getElementById('filtro-oficina').value
  };
}
function obtenerFiltrosPuntos(){
  const com = filtrosComunes();
  return {
    oficina: com.oficina,
    dia: document.getElementById('filtro-dia-puntos').value,
    canal: document.getElementById('filtro-canal-puntos').value
  };
}
function obtenerFiltrosChoro(){
  const com = filtrosComunes();
  return {
    oficina: com.oficina,
    dia: document.getElementById('filtro-dia-choro').value,
    canal: document.getElementById('filtro-canal-choro').value
  };
}

// Datos para puntos
function filtrarDatosPuntos(){
  const { oficina, dia, canal } = obtenerFiltrosPuntos();
  const filtrados = [];

  sigmaDataRTM.forEach(row=>{
    const lat = parseFloat(row[28]);
    const lng = parseFloat(row[29]);
    if (isNaN(lat) || isNaN(lng)) return;

    const oficinaRow = (row[46] || '').toString().trim();
    const diasRow = (row[48] || '').toString().toUpperCase().trim();
    const canalRow = (row[21] || '').toString().trim();

    if (oficina && oficinaRow !== oficina) return;
    if (dia && !diasRow.includes(dia)) return;
    if (canal && canalRow !== canal) return;

    filtrados.push(row);
  });

  return filtrados;
}

// Datos para coroplético
function filtrarDatosChoro(){
  const { oficina, dia, canal } = obtenerFiltrosChoro();
  const filtrados = [];

  sigmaDataRTM.forEach(row=>{
    const lat = parseFloat(row[28]);
    const lng = parseFloat(row[29]);
    if (isNaN(lat) || isNaN(lng)) return;

    const oficinaRow = (row[46] || '').toString().trim();
    const diasRow = (row[48] || '').toString().toUpperCase().trim();
    const canalRow = (row[21] || '').toString().trim();

    if (oficina && oficinaRow !== oficina) return;
    if (dia && !diasRow.includes(dia)) return;
    if (canal && canalRow !== canal) return;

    filtrados.push(row);
  });

  return filtrados;
}

function aplicarFiltrosRTM(){
  if (!rtmMap) return;

  const datosPuntos = filtrarDatosPuntos();
  const datosChoro = filtrarDatosChoro();

  // capas según checkboxes
  const mostrarPuntos = document.getElementById('chk-puntos').checked;
  const mostrarChoro = document.getElementById('chk-choro').checked;

  if (mostrarChoro){
    actualizarCoropletico(datosChoro);
  } else if (rtmChoroplethLayer){
    rtmMap.removeLayer(rtmChoroplethLayer);
    rtmChoroplethLayer = null;
  }

  if (mostrarPuntos){
    actualizarPuntos(datosPuntos);
  } else if (rtmMarkersLayer){
    rtmMap.removeLayer(rtmMarkersLayer);
    rtmMarkersLayer = null;
  }

  // Ajustar vista a puntos si están visibles; si no, usar coroplético
  const puntos = [];
  if (mostrarPuntos){
    datosPuntos.forEach(row=>{
      const lat = parseFloat(row[28]);
      const lng = parseFloat(row[29]);
      if (!isNaN(lat) && !isNaN(lng)){
        puntos.push([lat,lng]);
      }
    });
  } else if (mostrarChoro){
    datosChoro.forEach(row=>{
      const lat = parseFloat(row[28]);
      const lng = parseFloat(row[29]);
      if (!isNaN(lat) && !isNaN(lng)){
        puntos.push([lat,lng]);
      }
    });
  }
  if (puntos.length > 0){
    const bounds = L.latLngBounds(puntos);
    rtmMap.fitBounds(bounds,{padding:[30,30]});
  }
}

// --------- PUNTOS ----------
function actualizarPuntos(datos){
  if (rtmMarkersLayer){
    rtmMap.removeLayer(rtmMarkersLayer);
  }
  rtmMarkersLayer = L.layerGroup([], {pane:'panePuntos'}).addTo(rtmMap);

  datos.forEach(row=>{
    const lat = parseFloat(row[28]);
    const lng = parseFloat(row[29]);
    if (isNaN(lat) || isNaN(lng)) return;

    const oficina = (row[46] || '').toString().trim();
    const dias = (row[48] || '').toString().toUpperCase().trim();
    const canal = (row[21] || '').toString().trim();

    const codCliente = (row[0] || '').toString().trim();
    const nombreBase = row[7] || 'N/D';
    const extra1 = (row[8] || '').toString().trim();
    const extra2 = (row[9] || '').toString().trim();
    let nombreFull = `${codCliente} ${nombreBase}`;
    if (extra1 || extra2){
      const extras = [extra1, extra2].filter(x=>x).join(' ');
      nombreFull += ` - ${extras}`;
    }
    const direccionTxt = `${row[14] || 'N/D'} - ${row[DISTRITO_INDEX] || 'N/D'}`;
    const interlocutor = `${row[26] || 'N/D'} - ${oficina || 'N/D'}`;
    const ruta = `${row[12] || 'N/D'} - ${canal || 'N/D'}`;

    const gmaps = `https://www.google.com/maps?q=${lat},${lng}`;
    const popupContent = `
      <div style="
        background:rgba(15,23,42,0.95);
        color:#f9fafb;
        padding:8px 9px;
        border-radius:6px;
        font-size:11px;
        line-height:1.35;
        max-width:260px;
      ">
        <div style="margin-bottom:2px;">
          <span style="font-weight:bold;color:#f9735b;">Cliente:</span> ${nombreFull}
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Dirección:</span>
          <a href="${gmaps}" target="_blank" rel="noopener" style="color:#bfdbfe;text-decoration:none;">
            ${direccionTxt}
          </a>
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Interlocutor:</span> ${interlocutor}
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Ruta / Canal:</span> ${ruta}
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Días atención:</span> ${dias || 'N/D'}
        </div>
      </div>
    `;

    const color = getColorByCanal(canal);
    const marker = L.circleMarker([lat,lng],{
      pane:'panePuntos',
      radius:6,
      color:color,
      fillColor:color,
      fillOpacity:0.9,
      weight:1
    });

    marker.bindPopup(popupContent,{
      closeButton:true,
      autoClose:true,
      closeOnClick:true,
      className:'rm-dark-popup'
    });

    marker.addTo(rtmMarkersLayer);
  });
}

// --------- COROPLÉTICO ----------
function cargarDistritosGeoJSON(callback){
  if (distritosGeoJSON){
    callback();
    return;
  }
  fetch(DISTRITOS_GEOJSON_URL)
    .then(r=>r.json())
    .then(data=>{
      distritosGeoJSON = data;
      callback();
    })
    .catch(err=>{
      console.error('Error GeoJSON distritos', err);
    });
}

function actualizarCoropletico(datos){
  cargarDistritosGeoJSON(()=>{

    if (rtmChoroplethLayer){
      rtmMap.removeLayer(rtmChoroplethLayer);
    }

    const conteoDistritos = {};
    datos.forEach(row=>{
      const dist = (row[DISTRITO_INDEX] || '').toString().trim().toUpperCase();
      if (!dist) return;
      conteoDistritos[dist] = (conteoDistritos[dist] || 0) + 1;
    });

    const valores = Object.values(conteoDistritos);
    const maxVal = valores.length ? Math.max(...valores) : 0;

    function getColorByCount(c){
      if (c === 0) return 'rgba(148,163,184,0.10)';
      const t = c / maxVal;
      const r = Math.round(250 - t * 90);
      const g = Math.round(113 - t * 40);
      const b = Math.round(133 - t * 20);
      return `rgba(${r},${g},${b},0.7)`;
    }

    function style(feature){
      const nombreDist = (feature.properties.distrito || '').toString().trim().toUpperCase();
      const count = conteoDistritos[nombreDist] || 0;
      return {
        pane:'paneChoro',
        fillColor: getColorByCount(count),
        weight: 1,
        opacity: 1,
        color: '#4b5563',
        fillOpacity: 0.7
      };
    }

    function onEachFeature(feature, layer){
      const nombreDist = (feature.properties.distrito || '').toString().trim();
      const count = conteoDistritos[nombreDist.toUpperCase()] || 0;
      layer.bindPopup(`<strong>${nombreDist}</strong><br>Clientes: ${count}`);
    }

    rtmChoroplethLayer = L.geoJSON(distritosGeoJSON, {
      style: style,
      onEachFeature: onEachFeature,
      pane:'paneChoro'
    }).addTo(rtmMap);
  });
}
</script>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
  if (typeof loadSidebar === 'function') {
    loadSidebar('rtm-aid');
  }

  rtmMap = L.map('rtm-map', {
    closePopupOnClick:true
  }).setView([-12.1, -77.0], 12);

  // panes: coroplético debajo, puntos encima [web:64][web:67]
  paneChoro = rtmMap.createPane('paneChoro');
  paneChoro.style.zIndex = 400; // debajo de markers
  panePuntos = rtmMap.createPane('panePuntos');
  panePuntos.style.zIndex = 600; // encima del coroplético

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap'
  }).addTo(rtmMap);

  crearLeyendaCanal(rtmMap);
  cargarSigmaRTM();

  document.getElementById('filtro-oficina').addEventListener('change', aplicarFiltrosRTM);
  document.getElementById('filtro-dia-puntos').addEventListener('change', aplicarFiltrosRTM);
  document.getElementById('filtro-canal-puntos').addEventListener('change', aplicarFiltrosRTM);
  document.getElementById('filtro-dia-choro').addEventListener('change', aplicarFiltrosRTM);
  document.getElementById('filtro-canal-choro').addEventListener('change', aplicarFiltrosRTM);
  document.getElementById('chk-puntos').addEventListener('change', aplicarFiltrosRTM);
  document.getElementById('chk-choro').addEventListener('change', aplicarFiltrosRTM);
});
</script>

<script src="layout.js"></script>
</body>
</html>
