<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - RTM AID</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root{
      --sidebar-accent:#f9735b;
      --sidebar-accent-soft:#fde3dd;
      --main-bg:#f4f5f7;
      --card-bg:#ffffff;
      --border-soft:#e5e7eb;
      --text-main:#111827;
      --text-muted:#6b7280;
      --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      --content-max:1120px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font);
      background:var(--main-bg);
      color:var(--text-main);
      min-height:100vh;
      margin:0;
    }
    .layout{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    .main{
      flex:1;
      padding:72px 8px 8px;
      display:flex;
      justify-content:center;
    }
    .main-inner{
      width:100%;
      max-width:100%;
      display:flex;
      flex-direction:column;
    }

    .rm-header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:40;
      display:flex;
      justify-content:center;
      padding:10px 0;
      background:#020617;
      color:#f9fafb;
      border-bottom:1px solid rgba(148,163,184,0.4);
    }
    .rm-header-inner{
      width:100%;
      max-width:var(--content-max);
      padding:0 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .panel{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:6px;
      background:var(--card-bg);
      border-radius:14px;
      padding:10px 12px 10px;
      border:1px solid var(--border-soft);
      box-shadow:0 6px 20px rgba(15,23,42,0.08);
      min-height:0;
    }

    .panel-header{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .filtros-rtm{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:6px 8px;
      border-radius:10px;
      border:1px solid var(--border-soft);
      background:#f9fafb;
      font-size:12px;
      align-items:center;
    }
    .filtro-item{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:150px;
    }
    .filtro-item label{
      font-size:11px;
      font-weight:600;
      color:var(--text-muted);
    }
    .filtro-item select{
      padding:4px 7px;
      border-radius:7px;
      border:1px solid #d1d5db;
      font-size:11px;
      background:white;
    }

    .filtros-subgrupo{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .subgrupo-box{
      border-radius:8px;
      border:1px dashed #d1d5db;
      padding:4px 8px 6px;
      background:#ffffff;
      display:flex;
      gap:8px;
      align-items:flex-start;
      flex-wrap:wrap;
    }
    .subgrupo-box-title{
      font-size:11px;
      font-weight:700;
      color:#4b5563;
      margin-right:4px;
      white-space:nowrap;
    }
    .subgrupo-box .mini-item{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:130px;
    }
    .subgrupo-box .mini-item label{
      font-size:10px;
      font-weight:600;
      color:var(--text-muted);
    }
    .subgrupo-box .mini-item select{
      padding:4px 7px;
      border-radius:7px;
      border:1px solid #d1d5db;
      font-size:11px;
      background:white;
      height:26px;
    }

    .multi-select{
      position:relative;
      font-size:11px;
      width:100%;
    }
    .multi-select-button{
      width:100%;
      padding:4px 7px;
      border-radius:7px;
      border:1px solid #d1d5db;
      background:white;
      text-align:left;
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:6px;
      height:26px;
      line-height:1.2;
    }
    .multi-select-button span{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:11px;
      color:#111827;
    }
    .multi-select-button .caret{
      font-size:9px;
      color:#6b7280;
    }
    .multi-select-panel{
      position:absolute;
      top:100%;
      left:0;
      right:0;
      background:white;
      border-radius:8px;
      border:1px solid #d1d5db;
      box-shadow:0 8px 20px rgba(15,23,42,0.18);
      padding:4px 6px;
      margin-top:2px;
      z-index:500;
      display:none;
      max-height:180px;
      overflow:auto;
    }
    .multi-select.open .multi-select-panel{
      display:block;
    }
    .multi-select-option{
      display:flex;
      align-items:center;
      gap:4px;
      padding:2px 2px;
      cursor:pointer;
      font-size:10px;
    }
    .multi-select-option:hover{
      background:#f3f4f6;
    }
    .multi-select-option input{
      cursor:pointer;
    }
    .multi-select-divider{
      border-top:1px solid #e5e7eb;
      margin:2px 0 4px;
    }
    .multi-select-all{
      font-weight:600;
      color:#4b5563;
    }

    .toggle-capas{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      color:#4b5563;
      white-space:nowrap;
    }
    .toggle-capas label{
      display:flex;
      align-items:center;
      gap:3px;
      cursor:pointer;
    }

    .lima-switch-wrapper{
      display:flex;
      align-items:center;
      gap:4px;
      font-size:11px;
      margin-left:4px;
    }
    .lima-switch{
      position:relative;
      width:44px;
      height:18px;
    }
    .lima-switch input{
      opacity:0;
      width:0;
      height:0;
    }
    .lima-slider{
      position:absolute;
      cursor:pointer;
      top:0;
      left:0;
      right:0;
      bottom:0;
      background:#16a34a;
      transition:0.2s;
      border-radius:999px;
    }
    .lima-slider:before{
      position:absolute;
      content:"";
      height:14px;
      width:14px;
      left:2px;
      top:2px;
      background:white;
      transition:0.2s;
      border-radius:999px;
      box-shadow:0 0 2px rgba(0,0,0,0.3);
    }
    .lima-switch input:checked + .lima-slider{
      background:#b91c1c;
    }
    .lima-switch input:checked + .lima-slider:before{
      transform:translateX(22px);
    }

    .map-wrapper{
      flex:1;
      border-radius:10px;
      overflow:hidden;
      border:1px solid var(--border-soft);
      background:#e5e7eb;
      box-shadow:inset 0 0 6px rgba(15,23,42,0.18);
      display:flex;
      min-height:0;
      position:relative;
    }
    #rtm-map{
      flex:1;
      width:100%;
      height:78vh;
    }

    .leaflet-popup.rm-dark-popup .leaflet-popup-content-wrapper{
      background:transparent;
      box-shadow:none;
      border-radius:0;
      padding:0;
    }
    .leaflet-popup.rm-dark-popup .leaflet-popup-content{
      margin:0;
    }
    .leaflet-popup.rm-dark-popup .leaflet-popup-tip{
      display:none;
    }

    .info.legend{
      background:rgba(15,23,42,0.95);
      color:#f9fafb;
      padding:6px 8px;
      border-radius:6px;
      font-size:11px;
      line-height:1.4;
      box-shadow:0 4px 10px rgba(15,23,42,0.5);
    }

    @media(max-width:900px){
      .main{padding:66px 6px 6px;}
      #rtm-map{height:75vh;}
      .toggle-capas{margin-left:0;}
    }
    @media(max-width:640px){
      .filtros-rtm{flex-direction:column;align-items:flex-start;}
      .toggle-capas{margin-top:4px;}
    }
  </style>
</head>

<body>
<div class="layout">
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="main-inner">
      <section class="panel">
        <header class="panel-header">
          <div class="filtros-rtm">
            <!-- Oficina -->
            <div class="filtro-item" style="max-width:200px;">
              <label for="filtro-oficina">Oficina</label>
              <select id="filtro-oficina">
                <option value="">Todas</option>
              </select>
            </div>

            <!-- Subgrupos -->
            <div class="filtros-subgrupo">
              <div class="subgrupo-box">
                <span class="subgrupo-box-title">Puntos</span>
                <div class="mini-item">
                  <label for="filtro-dia-puntos">Día atención</label>
                  <select id="filtro-dia-puntos">
                    <option value="">Todos</option>
                    <option value="L">Lunes</option>
                    <option value="M">Martes</option>
                    <option value="X">Miércoles</option>
                    <option value="J">Jueves</option>
                    <option value="V">Viernes</option>
                    <option value="S">Sábado</option>
                    <option value="D">Domingo</option>
                  </select>
                </div>
                <div class="mini-item">
                  <label>Canal (multi)</label>
                  <div class="multi-select" id="multi-canal-puntos" data-target="canalesPuntos"></div>
                </div>
              </div>

              <div class="subgrupo-box">
                <span class="subgrupo-box-title">Coropléctico</span>
                <div class="mini-item">
                  <label for="filtro-dia-choro">Día atención</label>
                  <select id="filtro-dia-choro">
                    <option value="">Todos</option>
                    <option value="L">Lunes</option>
                    <option value="M">Martes</option>
                    <option value="X">Miércoles</option>
                    <option value="J">Jueves</option>
                    <option value="V">Viernes</option>
                    <option value="S">Sábado</option>
                    <option value="D">Domingo</option>
                  </select>
                </div>
                <div class="mini-item">
                  <label>Canal (multi)</label>
                  <div class="multi-select" id="multi-canal-choro" data-target="canalesChoro"></div>
                </div>
              </div>
            </div>

            <!-- Toggles capas + switch Perú/Lima -->
            <div class="toggle-capas">
              <label>
                <input type="checkbox" id="chk-puntos" checked />
                Puntos
              </label>
              <label>
                <input type="checkbox" id="chk-choro" checked />
                Coropléctico
              </label>
              <div class="lima-switch-wrapper">
                <span>Perú</span>
                <label class="lima-switch">
                  <input type="checkbox" id="switch-lima" />
                  <span class="lima-slider"></span>
                </label>
                <span>Lima</span>
              </div>
            </div>
          </div>
        </header>

        <div class="map-wrapper">
          <div id="rtm-map"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
const SIGMA_CSV_URL = 'https://raw.githubusercontent.com/Gokzarag/MapTrack/main/Catalogo%20Sigma.csv';
const DISTRITOS_GEOJSON_URL = 'https://raw.githubusercontent.com/Gokzarag/RoadMap/main/Distritos.geojson';
const DISTRITO_INDEX = 17;

let sigmaDataRTM = [];
let rtmMap = null;
let rtmMarkersLayer = null;
let rtmChoroplethLayer = null;
let distritosGeoJSON = null;

let paneChoro, panePuntos;

let canalesPuntos = ['DET','FSE','MES','MOD'];
let canalesChoro = ['DET','FSE','MES','MOD'];

let distritosLimaSet = new Set();

const canalColors = {
  'DET': '#e11d48',
  'FSE': '#2563eb',
  'MES': '#16a34a',
  'MOD': '#f97316'
};
function getColorByCanal(canal){
  return canalColors[canal] || '#6b7280';
}

function crearLeyendaCanal(mapInstance){
  const legend = L.control({ position:'bottomright' });
  legend.onAdd = function(){
    const div = L.DomUtil.create('div', 'info legend');
    div.innerHTML = '<strong>Canal</strong><br>';
    Object.keys(canalColors).forEach(canal=>{
      const color = canalColors[canal];
      div.innerHTML += `
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px;">
          <span style="display:inline-block;width:10px;height:10px;border-radius:999px;background:${color};"></span>
          <span>${canal}</span>
        </div>
      `;
    });
    return div;
  };
  legend.addTo(mapInstance);
}

function cargarSigmaRTM(){
  Papa.parse(SIGMA_CSV_URL, {
    download:true,
    header:false,
    skipEmptyLines:true,
    complete:function(res){
      sigmaDataRTM = res.data.slice(1);
      prepararFiltrosOficina();
      aplicarFiltrosRTM();
    }
  });
}

function prepararFiltrosOficina(){
  const selectOficina = document.getElementById('filtro-oficina');
  const oficinas = new Set();

  sigmaDataRTM.forEach(row=>{
    const oficina = (row[46] || '').toString().trim();
    if (oficina) oficinas.add(oficina);
  });

  Array.from(oficinas).sort().forEach(of=>{
    const opt = document.createElement('option');
    opt.value = of;
    opt.textContent = of;
    selectOficina.appendChild(opt);
  });
}

// --------- MULTISELECT ---------
const OPCIONES_CANAL = [
  {value:'DET', label:'DET'},
  {value:'FSE', label:'FSE'},
  {value:'MES', label:'MES'},
  {value:'MOD', label:'MOD'}
];

function crearMultiSelect(id, estadoInicial){
  const cont = document.getElementById(id);
  const targetKey = cont.dataset.target;
  cont.classList.add('multi-select');

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'multi-select-button';
  const spanText = document.createElement('span');
  const spanCaret = document.createElement('span');
  spanCaret.className = 'caret';
  spanCaret.textContent = '▾';
  btn.appendChild(spanText);
  btn.appendChild(spanCaret);

  const panel = document.createElement('div');
  panel.className = 'multi-select-panel';

  const rowTodos = document.createElement('label');
  rowTodos.className = 'multi-select-option multi-select-all';
  const cbTodos = document.createElement('input');
  cbTodos.type = 'checkbox';
  cbTodos.value = 'ALL';
  cbTodos.checked = true;
  const lblTodos = document.createElement('span');
  lblTodos.textContent = 'Todos';
  rowTodos.appendChild(cbTodos);
  rowTodos.appendChild(lblTodos);
  panel.appendChild(rowTodos);

  const divider = document.createElement('div');
  divider.className = 'multi-select-divider';
  panel.appendChild(divider);

  const checkboxes = [];
  OPCIONES_CANAL.forEach(op=>{
    const row = document.createElement('label');
    row.className = 'multi-select-option';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = op.value;
    cb.checked = estadoInicial.includes(op.value);
    const lbl = document.createElement('span');
    lbl.textContent = op.label;
    row.appendChild(cb);
    row.appendChild(lbl);
    panel.appendChild(row);
    checkboxes.push(cb);

    cb.addEventListener('change', ()=>{
      actualizarEstadoCanales(targetKey, op.value, cb.checked);
      syncTodosCheckbox(targetKey, cbTodos);
      actualizarTextoMulti(cont, targetKey);
      aplicarFiltrosRTM();
    });
  });

  cbTodos.addEventListener('change', ()=>{
    const marcar = cbTodos.checked;
    if (marcar){
      if (targetKey === 'canalesPuntos') canalesPuntos = OPCIONES_CANAL.map(o=>o.value);
      else canalesChoro = OPCIONES_CANAL.map(o=>o.value);
    } else {
      if (targetKey === 'canalesPuntos') canalesPuntos = [];
      else canalesChoro = [];
    }
    checkboxes.forEach(cb=>{
      cb.checked = marcar;
    });
    syncTodosCheckbox(targetKey, cbTodos);
    actualizarTextoMulti(cont, targetKey);
    aplicarFiltrosRTM();
  });

  btn.addEventListener('click', ()=>{
    cont.classList.toggle('open');
  });

  document.addEventListener('click', (e)=>{
    if (!cont.contains(e.target)){
      cont.classList.remove('open');
    }
  });

  cont.appendChild(btn);
  cont.appendChild(panel);

  syncTodosCheckbox(targetKey, cbTodos);
  actualizarTextoMulti(cont, targetKey);
}

function actualizarEstadoCanales(targetKey, value, checked){
  let arr = (targetKey === 'canalesPuntos') ? canalesPuntos : canalesChoro;
  if (checked){
    if (!arr.includes(value)) arr.push(value);
  } else {
    arr = arr.filter(v=>v !== value);
  }
  if (targetKey === 'canalesPuntos') canalesPuntos = arr;
  else canalesChoro = arr;
}

function syncTodosCheckbox(targetKey, cbTodos){
  const arr = (targetKey === 'canalesPuntos') ? canalesPuntos : canalesChoro;
  if (arr.length === OPCIONES_CANAL.length){
    cbTodos.checked = true;
    cbTodos.indeterminate = false;
  } else if (arr.length === 0){
    cbTodos.checked = false;
    cbTodos.indeterminate = false;
  } else {
    cbTodos.checked = false;
    cbTodos.indeterminate = true;
  }
}

function actualizarTextoMulti(cont, targetKey){
  const arr = (targetKey === 'canalesPuntos') ? canalesPuntos : canalesChoro;
  const spanText = cont.querySelector('.multi-select-button span');
  if (arr.length === OPCIONES_CANAL.length || arr.length === 0){
    spanText.textContent = 'Todos';
  } else {
    spanText.textContent = arr.join(', ');
  }
}

// --------- FILTRADO ---------
function filtrosComunes(){
  return {
    oficina: document.getElementById('filtro-oficina').value
  };
}
function obtenerFiltrosPuntos(){
  const com = filtrosComunes();
  return {
    oficina: com.oficina,
    dia: document.getElementById('filtro-dia-puntos').value,
    canales: canalesPuntos.slice()
  };
}
function obtenerFiltrosChoro(){
  const com = filtrosComunes();
  return {
    oficina: com.oficina,
    dia: document.getElementById('filtro-dia-choro').value,
    canales: canalesChoro.slice()
  };
}

// Sólo oficina para tooltips del coroplético
function filtrarSoloOficina(){
  const oficina = document.getElementById('filtro-oficina').value;
  if (!oficina) return sigmaDataRTM.slice();
  return sigmaDataRTM.filter(row=>{
    const oficinaRow = (row[46] || '').toString().trim();
    return oficinaRow === oficina;
  });
}

function filtrarDatosPuntos(){
  const { oficina, dia, canales } = obtenerFiltrosPuntos();
  const soloLima = document.getElementById('switch-lima').checked;
  const filtrados = [];

  sigmaDataRTM.forEach(row=>{
    const lat = parseFloat(row[28]);
    const lng = parseFloat(row[29]);
    if (isNaN(lat) || isNaN(lng)) return;

    const oficinaRow = (row[46] || '').toString().trim();
    const diasRow = (row[48] || '').toString().toUpperCase().trim();
    const canalRow = (row[21] || '').toString().trim();
    const distritoRow = (row[DISTRITO_INDEX] || '').toString().trim().toUpperCase();

    if (oficina && oficinaRow !== oficina) return;
    if (dia && !diasRow.includes(dia)) return;
    if (canales.length && !canales.includes(canalRow)) return;

    if (soloLima && distritosLimaSet.size > 0){
      if (!distritosLimaSet.has(distritoRow)) return;
    }

    filtrados.push(row);
  });

  return filtrados;
}

function filtrarDatosChoro(){
  const { oficina, dia, canales } = obtenerFiltrosChoro();
  const filtrados = [];

  sigmaDataRTM.forEach(row=>{
    const lat = parseFloat(row[28]);
    const lng = parseFloat(row[29]);
    if (isNaN(lat) || isNaN(lng)) return;

    const oficinaRow = (row[46] || '').toString().trim();
    const diasRow = (row[48] || '').toString().toUpperCase().trim();
    const canalRow = (row[21] || '').toString().trim();

    if (oficina && oficinaRow !== oficina) return;
    if (dia && !diasRow.includes(dia)) return;
    if (canales.length && !canales.includes(canalRow)) return;

    filtrados.push(row);
  });

  return filtrados;
}

function aplicarFiltrosRTM(){
  if (!rtmMap) return;

  const datosChoro = filtrarDatosChoro();
  const mostrarChoro = document.getElementById('chk-choro').checked;

  if (mostrarChoro){
    actualizarCoropletico(datosChoro);
  } else if (rtmChoroplethLayer){
    rtmMap.removeLayer(rtmChoroplethLayer);
    rtmChoroplethLayer = null;
  }

  const datosPuntos = filtrarDatosPuntos();
  const mostrarPuntos = document.getElementById('chk-puntos').checked;

  if (mostrarPuntos){
    actualizarPuntos(datosPuntos);
  } else if (rtmMarkersLayer){
    rtmMap.removeLayer(rtmMarkersLayer);
    rtmMarkersLayer = null;
  }

  const puntos = [];
  if (mostrarPuntos){
    datosPuntos.forEach(row=>{
      const lat = parseFloat(row[28]);
      const lng = parseFloat(row[29]);
      if (!isNaN(lat) && !isNaN(lng)){
        puntos.push([lat,lng]);
      }
    });
  } else if (mostrarChoro){
    datosChoro.forEach(row=>{
      const lat = parseFloat(row[28]);
      const lng = parseFloat(row[29]);
      if (!isNaN(lat) && !isNaN(lng)){
        puntos.push([lat,lng]);
      }
    });
  }

  if (puntos.length > 0){
    const bounds = L.latLngBounds(puntos);
    rtmMap.fitBounds(bounds,{padding:[30,30]});
  }
}

// --------- PUNTOS ----------
function actualizarPuntos(datos){
  if (rtmMarkersLayer){
    rtmMap.removeLayer(rtmMarkersLayer);
  }
  rtmMarkersLayer = L.layerGroup([], {pane:'panePuntos'}).addTo(rtmMap);

  datos.forEach(row=>{
    const lat = parseFloat(row[28]);
    const lng = parseFloat(row[29]);
    if (isNaN(lat) || isNaN(lng)) return;

    const oficina = (row[46] || '').toString().trim();
    const dias = (row[48] || '').toString().toUpperCase().trim();
    const canal = (row[21] || '').toString().trim();

    const codCliente = (row[0] || '').toString().trim();
    const nombreBase = row[7] || 'N/D';
    const extra1 = (row[8] || '').toString().trim();
    const extra2 = (row[9] || '').toString().trim();
    let nombreFull = `${codCliente} ${nombreBase}`;
    if (extra1 || extra2){
      const extras = [extra1, extra2].filter(x=>x).join(' ');
      nombreFull += ` - ${extras}`;
    }
    const direccionTxt = `${row[14] || 'N/D'} - ${row[DISTRITO_INDEX] || 'N/D'}`;
    const interlocutor = `${row[26] || 'N/D'} - ${oficina || 'N/D'}`;
    const ruta = `${row[12] || 'N/D'} - ${canal || 'N/D'}`;

    const gmaps = `https://www.google.com/maps?q=${lat},${lng}`;
    const popupContent = `
      <div style="
        background:rgba(15,23,42,0.95);
        color:#f9fafb;
        padding:8px 9px;
        border-radius:6px;
        font-size:11px;
        line-height:1.35;
        max-width:260px;
      ">
        <div style="margin-bottom:2px;">
          <span style="font-weight:bold;color:#f9735b;">Cliente:</span> ${nombreFull}
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Dirección:</span>
          <a href="${gmaps}" target="_blank" rel="noopener" style="color:#bfdbfe;text-decoration:none;">
            ${direccionTxt}
          </a>
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Interlocutor:</span> ${interlocutor}
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Ruta / Canal:</span> ${ruta}
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Días atención:</span> ${dias || 'N/D'}
        </div>
      </div>
    `;

    const color = getColorByCanal(canal);
    const marker = L.circleMarker([lat,lng],{
      pane:'panePuntos',
      radius:6,
      color:color,
      fillColor:color,
      fillOpacity:0.9,
      weight:1
    });

    marker.bindPopup(popupContent,{
      closeButton:true,
      autoClose:true,
      closeOnClick:true,
      className:'rm-dark-popup'
    });

    marker.addTo(rtmMarkersLayer);
  });
}

// --------- COROPLÉTICO ----------
function cargarDistritosGeoJSON(callback){
  if (distritosGeoJSON){
    callback();
    return;
  }
  fetch(DISTRITOS_GEOJSON_URL)
    .then(r=>r.json())
    .then(data=>{
      distritosGeoJSON = data;
      distritosLimaSet = new Set();
      data.features.forEach(f=>{
        const nombreDist = (f.properties.distrito || '').toString().trim().toUpperCase();
        if (nombreDist) distritosLimaSet.add(nombreDist);
      });
      callback();
    })
    .catch(err=>{
      console.error('Error GeoJSON distritos', err);
    });
}

function construirFrecuenciaDias(rows){
  const setLetras = new Set();
  rows.forEach(row=>{
    const dias = (row[48] || '').toString().toUpperCase().trim();
    for (let ch of dias){
      if ('LMXJVSD'.includes(ch)) setLetras.add(ch);
    }
  });
  const orden = ['L','M','X','J','V','S','D'];
  return orden.filter(l=>setLetras.has(l)).join('') || 'N/D';
}

function actualizarCoropletico(datos){
  cargarDistritosGeoJSON(()=>{

    if (rtmChoroplethLayer){
      rtmMap.removeLayer(rtmChoroplethLayer);
    }

    // Para color: usa datos filtrados por día/canal/oficina
    const conteoDistritos = {};
    datos.forEach(row=>{
      const dist = (row[DISTRITO_INDEX] || '').toString().trim().toUpperCase();
      if (!dist) return;
      conteoDistritos[dist] = (conteoDistritos[dist] || 0) + 1;
    });

    const valores = Object.values(conteoDistritos);
    const maxVal = valores.length ? Math.max(...valores) : 0;

    function getPurpleColor(c){
      if (c === 0) return 'rgba(229,231,235,0.2)';
      const t = c / (maxVal || 1);
      const h = 280;
      const s = 60 + t * 15;
      const l = 80 - t * 35;
      const a = s * Math.min(l, 100 - l) / 10000;
      const f = n => {
        const k = (n + h / 30) % 12;
        const col = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1) * 100;
        return Math.round(255 * col / 100);
      };
      const r = f(0), g = f(8), b = f(4);
      return `rgba(${r},${g},${b},0.7)`;
    }

    // Para tooltip: sólo oficina
    const datosOficina = filtrarSoloOficina();
    const filasPorDistritoOf = {};
    datosOficina.forEach(row=>{
      const dist = (row[DISTRITO_INDEX] || '').toString().trim().toUpperCase();
      if (!dist) return;
      if (!filasPorDistritoOf[dist]) filasPorDistritoOf[dist] = [];
      filasPorDistritoOf[dist].push(row);
    });

    function style(feature){
      const nombreDist = (feature.properties.distrito || '').toString().trim().toUpperCase();
      const count = conteoDistritos[nombreDist] || 0;
      return {
        pane:'paneChoro',
        fillColor: getPurpleColor(count),
        weight: 1,
        opacity: 1,
        color: '#4b5563',
        fillOpacity: 0.7
      };
    }

    function onEachFeature(feature, layer){
      const nombreDist = (feature.properties.distrito || '').toString().trim();
      const key = nombreDist.toUpperCase();
      const filas = filasPorDistritoOf[key] || [];
      const count = filas.length;
      const freq = construirFrecuenciaDias(filas);
      layer.bindPopup(`<strong>${nombreDist}</strong><br>Clientes: ${count}<br>Frecuencia: ${freq}`);
    }

    rtmChoroplethLayer = L.geoJSON(distritosGeoJSON, {
      style: style,
      onEachFeature: onEachFeature,
      pane:'paneChoro'
    }).addTo(rtmMap);
  });
}
