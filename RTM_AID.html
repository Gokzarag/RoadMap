<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - RTM AID</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root{
      --sidebar-accent:#f9735b;
      --sidebar-accent-soft:#fde3dd;
      --main-bg:#f4f5f7;
      --card-bg:#ffffff;
      --border-soft:#e5e7eb;
      --text-main:#111827;
      --text-muted:#6b7280;
      --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      --content-max:1120px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font);
      background:var(--main-bg);
      color:var(--text-main);
      min-height:100vh;
      margin:0;
    }
    .layout{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    .main{
      flex:1;
      padding:72px 12px 12px;
      display:flex;
      justify-content:center;
    }
    .main-inner{
      width:100%;
      max-width:100%; /* TODO: ancho completo de la página */
      display:flex;
      flex-direction:column;
    }

    /* Header (sidebar.html) */
    .rm-header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:40;
      display:flex;
      justify-content:center;
      padding:10px 0;
      background:#020617;
      color:#f9fafb;
      border-bottom:1px solid rgba(148,163,184,0.4);
    }
    .rm-header-inner{
      width:100%;
      max-width:var(--content-max);
      padding:0 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .rm-header-left{display:flex;align-items:center;gap:8px;}
    .rm-logo{
      width:26px;height:26px;border-radius:8px;
      border:1px solid rgba(249,250,251,0.3);
    }
    .rm-title{display:flex;flex-direction:column;}
    .rm-title span:first-child{
      font-size:10px;text-transform:uppercase;
      letter-spacing:0.12em;color:#9ca3af;
    }
    .rm-title span:last-child{
      font-size:13px;font-weight:600;
    }
    .rm-header-center{
      display:flex;flex-direction:column;align-items:center;gap:2px;
    }
    .rm-label{
      font-size:10px;text-transform:uppercase;color:#9ca3af;
    }
    .rm-zona{display:flex;gap:4px;}
    .zona-pill{
      border-radius:999px;
      padding:3px 8px;
      font-size:11px;
      border:1px solid rgba(249,250,251,0.16);
      background:#0f172a;
      color:#e5e7eb;
      cursor:pointer;
      white-space:nowrap;
    }
    .zona-pill.active{
      background:#f9735b;
      color:#111827;
    }
    .rm-header-right .btn-menu{
      background:none;
      border:1px solid rgba(249,250,251,0.4);
      color:#f9fafb;
      border-radius:6px;
      padding:3px 8px;
      font-size:16px;
      cursor:pointer;
    }

    .menu-popup{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,0.6);
      display:flex;
      justify-content:flex-start;
      align-items:stretch;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      z-index:40;
    }
    .menu-popup.open{
      opacity:1;
      pointer-events:auto;
    }
    .menu-popup-inner{
      width:240px;
      max-width:80%;
      background:#020617;
      color:#f9fafb;
      padding:14px 12px 16px;
      box-shadow:0 8px 30px rgba(0,0,0,0.5);
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .menu-popup-close{
      align-self:flex-end;
      background:none;
      border:none;
      color:#e5e7eb;
      font-size:18px;
      cursor:pointer;
      margin-bottom:4px;
    }
    .menu-popup-title{
      font-size:13px;
      margin-bottom:4px;
    }
    .menu-popup-nav a{
      display:block;
      padding:5px 4px;
      color:#e5e7eb;
      text-decoration:none;
      border-radius:6px;
      font-size:13px;
    }
    .menu-popup-nav a:hover{
      background:rgba(148,163,184,0.25);
    }

    @media(max-width:900px){
      .rm-header-inner{flex-wrap:wrap;}
      .rm-header-center{
        order:3;width:100%;align-items:flex-start;
      }
    }

    /* Panel RTM AID */
    .panel{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:8px;
      background:var(--card-bg);
      border-radius:14px;
      padding:14px 14px 16px;
      border:1px solid var(--border-soft);
      box-shadow:0 6px 20px rgba(15,23,42,0.08);
      min-height:0;
    }
    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
    }
    .panel-title h1{
      font-size:18px;
      margin-bottom:4px;
    }
    .panel-meta{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:4px;
      font-size:11px;
    }
    .badge-zona-main{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      background:var(--sidebar-accent-soft);
      color:#7c2d12;
      border:1px solid #fed7c2;
      display:inline-flex;
      align-items:center;
      gap:4px;
    }

    .filtros-rtm{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:4px;
      padding:8px 8px 10px;
      border-radius:10px;
      border:1px solid var(--border-soft);
      background:#f9fafb;
      font-size:12px;
    }
    .filtro-item{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:160px;
      flex:1;
    }
    .filtro-item label{
      font-size:11px;
      font-weight:600;
      color:var(--text-muted);
    }
    .filtro-item select{
      padding:5px 7px;
      border-radius:7px;
      border:1px solid #d1d5db;
      font-size:12px;
      background:white;
    }

    .map-wrapper{
      flex:1;
      margin-top:4px;
      border-radius:10px;
      overflow:hidden;
      border:1px solid var(--border-soft);
      background:#e5e7eb;
      box-shadow:inset 0 0 6px rgba(15,23,42,0.18);
      display:flex;
      min-height:0;
      position:relative;
    }
    #rtm-map{
      flex:1;
      width:100%;
      height:75vh;
    }

    /* Popup negro */
    .leaflet-popup.rm-dark-popup .leaflet-popup-content-wrapper{
      background:transparent;
      box-shadow:none;
      border-radius:0;
      padding:0;
    }
    .leaflet-popup.rm-dark-popup .leaflet-popup-content{
      margin:0;
    }
    .leaflet-popup.rm-dark-popup .leaflet-popup-tip{
      display:none;
    }

    .info.legend{
      background:rgba(15,23,42,0.95);
      color:#f9fafb;
      padding:6px 8px;
      border-radius:6px;
      font-size:11px;
      line-height:1.4;
      box-shadow:0 4px 10px rgba(15,23,42,0.5);
    }

    @media(max-width:900px){
      .main{padding:66px 8px 10px;}
      #rtm-map{height:70vh;}
    }
    @media(max-width:480px){
      .panel-title h1{font-size:16px;}
      .rm-header-inner{padding:0 10px;}
    }
  </style>
</head>

<body>
<div class="layout">
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="main-inner">
      <section class="panel">
        <header class="panel-header">
          <div class="panel-title">
            <h1>RTM AID - Catálogo Sigma</h1>

            <div class="filtros-rtm">
              <div class="filtro-item">
                <label for="filtro-oficina">Oficina</label>
                <select id="filtro-oficina">
                  <option value="">Todas</option>
                </select>
              </div>

              <div class="filtro-item">
                <label for="filtro-dia">Día de atención</label>
                <select id="filtro-dia">
                  <option value="">Todos</option>
                  <option value="L">Lunes</option>
                  <option value="M">Martes</option>
                  <option value="X">Miércoles</option>
                  <option value="J">Jueves</option>
                  <option value="V">Viernes</option>
                  <option value="S">Sábado</option>
                  <option value="D">Domingo</option>
                </select>
              </div>

              <div class="filtro-item">
                <label for="filtro-canal">Canal</label>
                <select id="filtro-canal">
                  <option value="">Todos</option>
                  <option value="DET">DET</option>
                  <option value="FSE">FSE</option>
                  <option value="MES">MES</option>
                  <option value="MOD">MOD</option>
                </select>
              </div>
            </div>
          </div>

          <div class="panel-meta">
            <span class="badge-zona-main">Zona activa: <strong id="badge-zona-text">-</strong></span>
          </div>
        </header>

        <div class="map-wrapper">
          <div id="rtm-map"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- Zona activa -->
<script>
function getZona(){
  return localStorage.getItem('maptrack_zona') || '0752';
}
function setZona(z){
  localStorage.setItem('maptrack_zona', z);
  pintarZona();
}
function pintarZona(){
  const z = getZona();
  const label = (z === '0752' ? 'Cadi Chorrillos' : 'Cedi Ate');
  const badge = document.getElementById('badge-zona-text');
  if (badge) badge.textContent = label;
}
</script>

<script>
const SIGMA_CSV_URL = 'https://raw.githubusercontent.com/Gokzarag/MapTrack/main/Catalogo%20Sigma.csv';
let sigmaDataRTM = [];
let rtmMap = null;
let rtmMarkersLayer = null;

// Colores por canal (índice 21: DET, FSE, MES, MOD)
const canalColors = {
  'DET': '#e11d48',
  'FSE': '#2563eb',
  'MES': '#16a34a',
  'MOD': '#f97316'
};
function getColorByCanal(canal){
  return canalColors[canal] || '#6b7280';
}

function crearLeyendaCanal(mapInstance){
  const legend = L.control({ position:'bottomright' });

  legend.onAdd = function(){
    const div = L.DomUtil.create('div', 'info legend');
    div.innerHTML = '<strong>Canal</strong><br>';
    Object.keys(canalColors).forEach(canal=>{
      const color = canalColors[canal];
      div.innerHTML += `
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px;">
          <span style="display:inline-block;width:10px;height:10px;border-radius:999px;background:${color};"></span>
          <span>${canal}</span>
        </div>
      `;
    });
    return div;
  };

  legend.addTo(mapInstance);
}

function cargarSigmaRTM(){
  Papa.parse(SIGMA_CSV_URL, {
    download:true,
    header:false,
    skipEmptyLines:true,
    complete:function(res){
      // Primera fila son encabezados
      sigmaDataRTM = res.data.slice(1);
      prepararFiltrosOficina();
      aplicarFiltrosRTM();
    }
  });
}

function prepararFiltrosOficina(){
  const selectOficina = document.getElementById('filtro-oficina');
  const oficinas = new Set();

  sigmaDataRTM.forEach(row=>{
    const oficina = (row[46] || '').toString().trim();
    if (oficina) oficinas.add(oficina);
  });

  Array.from(oficinas).sort().forEach(of=>{
    const opt = document.createElement('option');
    opt.value = of;
    opt.textContent = of;
    selectOficina.appendChild(opt);
  });
}

function aplicarFiltrosRTM(){
  if (!rtmMap) return;

  const selOficina = document.getElementById('filtro-oficina').value;
  const selDia = document.getElementById('filtro-dia').value;      // L,M,X,J,V,S,D
  const selCanal = document.getElementById('filtro-canal').value;  // DET,FSE,MES,MOD

  if (rtmMarkersLayer){
    rtmMap.removeLayer(rtmMarkersLayer);
  }
  rtmMarkersLayer = L.layerGroup().addTo(rtmMap);

  const puntos = [];

  sigmaDataRTM.forEach(row=>{
    const lat = parseFloat(row[28]);
    const lng = parseFloat(row[29]);
    if (isNaN(lat) || isNaN(lng)) return;

    const oficina = (row[46] || '').toString().trim();
    const dias = (row[48] || '').toString().toUpperCase().trim();
    const canal = (row[21] || '').toString().trim(); // DET, FSE, MES, MOD

    // Filtro oficina
    if (selOficina && oficina !== selOficina) return;

    // Filtro día (inicial dentro de la cadena)
    if (selDia && !dias.includes(selDia)) return;

    // Filtro canal
    if (selCanal && canal !== selCanal) return;

    const codCliente = (row[0] || '').toString().trim();
    const nombreBase = row[7] || 'N/D';
    const extra1 = (row[8] || '').toString().trim();
    const extra2 = (row[9] || '').toString().trim();
    let nombreFull = `${codCliente} ${nombreBase}`;
    if (extra1 || extra2){
      const extras = [extra1, extra2].filter(x=>x).join(' ');
      nombreFull += ` - ${extras}`;
    }
    const direccionTxt = `${row[14] || 'N/D'} - ${row[17] || 'N/D'}`;
    const interlocutor = `${row[26] || 'N/D'} - ${oficina || 'N/D'}`;
    const ruta = `${row[12] || 'N/D'} - ${canal || 'N/D'}`;

    const gmaps = `https://www.google.com/maps?q=${lat},${lng}`;
    const popupContent = `
      <div style="
        background:rgba(15,23,42,0.95);
        color:#f9fafb;
        padding:8px 9px;
        border-radius:6px;
        font-size:11px;
        line-height:1.35;
        max-width:260px;
      ">
        <div style="margin-bottom:2px;">
          <span style="font-weight:bold;color:#f9735b;">Cliente:</span> ${nombreFull}
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Dirección:</span>
          <a href="${gmaps}" target="_blank" rel="noopener" style="color:#bfdbfe;text-decoration:none;">
            ${direccionTxt}
          </a>
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Interlocutor:</span> ${interlocutor}
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Ruta / Canal:</span> ${ruta}
        </div>
        <div>
          <span style="font-weight:bold;color:#f9735b;">Días atención:</span> ${dias || 'N/D'}
        </div>
      </div>
    `;

    const color = getColorByCanal(canal);
    const marker = L.circleMarker([lat,lng],{
      radius:6,
      color:color,
      fillColor:color,
      fillOpacity:0.85,
      weight:1
    });

    marker.bindPopup(popupContent,{
      closeButton:true,
      autoClose:true,
      closeOnClick:true,
      className:'rm-dark-popup'
    });

    marker.addTo(rtmMarkersLayer);
    puntos.push([lat,lng]);
  });

  if (puntos.length > 0){
    const bounds = L.latLngBounds(puntos);
    rtmMap.fitBounds(bounds,{padding:[30,30]});
  }
}
</script>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
  if (typeof loadSidebar === 'function') {
    loadSidebar('rtm-aid');
  }
  pintarZona();

  rtmMap = L.map('rtm-map', {
    closePopupOnClick:true
  }).setView([-12.1, -77.0], 12); /* closePopupOnClick controla cierre al clicar mapa [web:32][web:34] */
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap'
  }).addTo(rtmMap);

  crearLeyendaCanal(rtmMap);
  cargarSigmaRTM();

  document.getElementById('filtro-oficina').addEventListener('change', aplicarFiltrosRTM);
  document.getElementById('filtro-dia').addEventListener('change', aplicarFiltrosRTM);
  document.getElementById('filtro-canal').addEventListener('change', aplicarFiltrosRTM);
});
</script>

<script src="layout.js"></script>
</body>
</html>
