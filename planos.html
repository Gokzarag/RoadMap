<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - Planos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" />
  <!-- Estilos: mismos que agenda, pero se podría extraer a CSS común -->
  <!-- Para ahorrar espacio no repito todo: copia el <style> completo de agenda.html
       y úsalo también aquí, solo cambia el contenido del main. -->
</head>
<body>
<div class="layout">
  <!-- Copia el mismo <aside> de agenda.html cambiando el activo -->
  <!-- ... -->
  <main class="main">
    <div class="card">
      <div class="card-header">
        <div class="card-header-left">
          <h1>Planos de clientes</h1>
          <p>Mapa interactivo con clientes geolocalizados y tu ubicación en vivo.</p>
        </div>
        <div class="badge-zona">
          Zona activa:
          <strong id="badge-zona-text">...</strong>
        </div>
      </div>

      <div style="font-size:13px;color:#6b7280;margin-bottom:8px;">
        Usa los controles para filtrar por ruta, vehículo o rango de kilos y visualizar la carga en el mapa.
      </div>

      <div class="filters">
        <label>
          Ruta
          <input type="text" id="p-ruta" placeholder="Ruta venta" />
        </label>
        <label>
          Vehículo
          <input type="text" id="p-vehiculo" placeholder="Placa" />
        </label>
        <label>
          Ciudad
          <input type="text" id="p-ciudad" placeholder="Ciudad" />
        </label>
      </div>

      <div id="map" style="width:100%;height:460px;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
        <!-- Aquí podrás incrustar un mapa Leaflet o Google Maps usando las columnas de lat/lon del CSV -->
      </div>
    </div>
  </main>
</div>

<script>
  function getZona(){ return localStorage.getItem('maptrack_zona') || '0752'; }
  function setZona(z){ localStorage.setItem('maptrack_zona', z); pintarZona(); }
  function pintarZona(){
    const z = getZona();
    const ate = document.getElementById('zona-ate');
    const ch = document.getElementById('zona-chorr');
    if (ate && ch){
      ate.classList.toggle('active', z === '0374');
      ch.classList.toggle('active', z === '0752');
    }
    const label = z === '0752' ? 'Cadi Chorrillos' : 'Cedi Ate';
    const badge = document.getElementById('badge-zona-text');
    if (badge) badge.textContent = label;
  }
  document.addEventListener('DOMContentLoaded', pintarZona);
</script>
</body>
</html>
