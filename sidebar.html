<header class="rm-header">
  <div class="rm-header-inner">
    <div class="rm-header-left">
      <button id="btn-menu" class="btn-menu" aria-label="Mostrar menú de módulos">☰</button>

      <div class="rm-logo-shell">
        <img src="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png"
             class="rm-logo" alt="MapTrack" />
      </div>

      <div class="rm-title-block">
        <span class="rm-app-main">ROADMAP</span>
        <span class="rm-app-sub">Distribution Platform</span>
      </div>

      <div class="rm-office-inline">
        <span class="rm-office-label">Oficina</span>
        <select id="select-zona" class="rm-zona-select" onchange="onZonaChange(this.value)">
          <option value="0374">Cedi Ate</option>
          <option value="0752">Cadi Chorrillos</option>
        </select>
      </div>
    </div>

    <div class="rm-header-right"></div>
  </div>
</header>

<div id="menu-popup" class="menu-popup">
  <div class="menu-popup-panel">
    <button id="menu-close" class="menu-popup-close" aria-label="Cerrar menú">✕</button>
    <nav class="menu-popup-nav">
      <a href="index.html">Inicio</a>
      <a href="agenda.html">Agenda</a>
      <a href="planos.html">Planos</a>
      <a href="ubicame.html">Ubícame</a>
      <a href="documentos.html">Documentos</a>
    </nav>
  </div>
</div>

<script>
  // se ejecuta cuando cambias el select
  function onZonaChange(z){
    if (typeof setZona === 'function') {
      setZona(z);
    } else {
      localStorage.setItem('maptrack_zona', z);
    }
  }

  // sincroniza el select con la zona guardada y pinta la zona
  document.addEventListener('DOMContentLoaded', () => {
    const sel = document.getElementById('select-zona');
    if (!sel) return;

    let current = null;
    if (typeof getZona === 'function') {
      current = getZona();
    } else {
      current = localStorage.getItem('maptrack_zona') || '0752';
    }
    sel.value = current;

    if (typeof pintarZona === 'function') {
      pintarZona();
    }

    // inicializa popup menú (layout.js debe definir initPopupMenu)
    if (typeof initPopupMenu === 'function') {
      initPopupMenu();
    }
  });
</script>

<style>
  .rm-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:40;
    display:flex;
    justify-content:center;
    padding:8px 0;
    background:#020617;
    color:#f9fafb;
    border-bottom:1px solid rgba(148,163,184,0.4);
  }
  .rm-header-inner{
    width:100%;
    max-width:1120px;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .rm-header-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .rm-header-right{
    min-width:40px;
  }
  .btn-menu{
    position:relative;
    background:rgba(15,23,42,1);
    border:1px solid rgba(249,250,251,0.35);
    color:#f9fafb;
    border-radius:999px;
    padding:5px 10px;
    font-size:15px;
    cursor:pointer;
  }
  .btn-menu:hover{
    background:#020617;
  }
  .rm-logo-shell{
    width:30px;
    height:30px;
    border-radius:8px;
    background:#020617;
    border:1px solid rgba(249,250,251,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .rm-logo{
    width:22px;
    height:22px;
    border-radius:6px;
  }
  .rm-title-block{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .rm-app-main{
    font-size:12px;
    letter-spacing:0.19em;
    text-transform:uppercase;
    font-weight:700;
  }
  .rm-app-sub{
    font-size:11px;
    color:#e5e7eb;
    opacity:0.85;
  }
  .rm-office-inline{
    display:flex;
    align-items:center;
    gap:6px;
    margin-left:18px;
  }
  .rm-office-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:#e5e7eb;
    opacity:0.9;
  }
  .rm-zona-select{
    min-width:150px;
    padding:4px 28px 4px 10px;
    border-radius:999px;
    border:1px solid rgba(148,163,184,0.9);
    background:#020617;
    color:#f9fafb;
    font-size:12px;
    outline:none;
    appearance:none;
    -moz-appearance:none;
    -webkit-appearance:none;
    background-image:
      linear-gradient(45deg,transparent 50%,#e5e7eb 50%),
      linear-gradient(135deg,#e5e7eb 50%,transparent 50%);
    background-position:
      calc(100% - 16px) 55%,
      calc(100% - 10px) 55%;
    background-size:6px 6px;
    background-repeat:no-repeat;
  }
  .rm-zona-select:focus{
    border-color:#f9735b;
    box-shadow:0 0 0 1px rgba(248,113,113,0.4);
  }
  .menu-popup{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:45;
  }
  .menu-popup-panel{
    position:absolute;
    top:42px;
    left:24px;
    background:#020617;
    color:#f9fafb;
    border-radius:10px;
    padding:8px 10px;
    border:1px solid rgba(148,163,184,0.6);
    box-shadow:0 10px 30px rgba(0,0,0,0.55);
    min-width:140px;
    max-width:220px;
    display:none;
    flex-direction:column;
    gap:4px;
  }
  .menu-popup.open .menu-popup-panel{
    display:flex;
    pointer-events:auto;
  }
  .menu-popup-close{
    align-self:flex-end;
    background:none;
    border:none;
    color:#e5e7eb;
    font-size:16px;
    cursor:pointer;
    margin-bottom:2px;
  }
  .menu-popup-nav a{
    display:block;
    padding:4px 4px;
    color:#e5e7eb;
    text-decoration:none;
    border-radius:6px;
    font-size:13px;
  }
  .menu-popup-nav a:hover{
    background:rgba(148,163,184,0.25);
  }
  @media(max-width:900px){
    .rm-header-inner{
      padding:0 12px;
    }
    .rm-office-inline{
      margin-left:10px;
    }
  }
</style>
