<!-- Encabezado común -->
<header class="rm-header">
  <div class="rm-header-inner">
    <!-- Branding -->
    <div class="rm-brand-left">
      <button id="btn-menu" class="btn-menu" aria-label="Mostrar menú de módulos">☰</button>

      <div class="rm-logo-shell">
        <img src="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png"
             class="rm-logo" alt="MapTrack" />
      </div>

      <div class="rm-title-block">
        <span class="rm-app-main">ROADMAP</span>
        <span class="rm-app-sub">Distribution Platform</span>
      </div>
    </div>

    <!-- Selector de oficina -->
    <div class="rm-header-center">
      <label for="select-zona" class="rm-chip-label">OFICINA</label>
      <select id="select-zona" class="rm-zona-select" onchange="onZonaChange(this.value)">
        <option value="0374">Cedi Ate</option>
        <option value="0752">Cadi Chorrillos</option>
      </select>
    </div>

    <!-- Lado derecho reservado -->
    <div class="rm-header-right"></div>
  </div>
</header>

<!-- Popup de módulos -->
<div id="menu-popup" class="menu-popup">
  <div class="menu-popup-inner">
    <button id="menu-close" class="menu-popup-close" aria-label="Cerrar menú">✕</button>
    <h3 class="menu-popup-title">Módulos</h3>
    <nav class="menu-popup-nav">
      <a href="index.html">Inicio</a>
      <a href="agenda.html">Agenda</a>
      <a href="planos.html">Planos</a>
      <a href="ubicame.html">Ubícame</a>
      <a href="documentos.html">Documentos</a>
    </nav>
  </div>
</div>

<script>
  // Sincroniza el <select> con tu lógica existente de zona
  function onZonaChange(z){
    setZona(z);           // ya lo tienes definido en cada página
  }

  document.addEventListener('DOMContentLoaded', () => {
    const sel = document.getElementById('select-zona');
    if (!sel || typeof getZona !== 'function') return;
    const current = getZona();
    if (current) sel.value = current;
  });
</script>
<style>
  /* Barra fija, limpia y centrada */
  .rm-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:40;
    display:flex;
    justify-content:center;
    padding:10px 0 8px;
    background:#020617;
    color:#f9fafb;
    border-bottom:1px solid rgba(148,163,184,0.4);
  }
  .rm-header-inner{
    width:100%;
    max-width:1120px;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }

  /* Branding izquierda */
  .rm-brand-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .btn-menu{
    background:rgba(15,23,42,1);
    border:1px solid rgba(249,250,251,0.35);
    color:#f9fafb;
    border-radius:999px;
    padding:5px 10px;
    font-size:15px;
    cursor:pointer;
  }
  .btn-menu:hover{
    background:#020617;
  }

  .rm-logo-shell{
    width:30px;
    height:30px;
    border-radius:8px;
    background:#020617;
    border:1px solid rgba(249,250,251,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .rm-logo{
    width:22px;
    height:22px;
    border-radius:6px;
  }

  .rm-title-block{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .rm-app-main{
    font-size:12px;
    letter-spacing:0.19em;
    text-transform:uppercase;
    font-weight:700;
  }
  .rm-app-sub{
    font-size:11px;
    color:#e5e7eb;
    opacity:0.85;
  }

  /* Centro: label + select armonioso */
  .rm-header-center{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .rm-chip-label{
    padding:2px 10px;
    border-radius:999px;
    border:1px solid rgba(248,250,252,0.35);
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#e5e7eb;
    background:#020617;
  }

  .rm-zona-select{
    min-width:170px;
    padding:5px 12px;
    border-radius:999px;
    border:1px solid rgba(148,163,184,0.9);
    background:#020617;
    color:#f9fafb;
    font-size:12px;
    outline:none;
    appearance:none;
    -moz-appearance:none;
    -webkit-appearance:none;
    background-image:
      linear-gradient(45deg,transparent 50%,#e5e7eb 50%),
      linear-gradient(135deg,#e5e7eb 50%,transparent 50%);
    background-position:
      calc(100% - 16px) 55%,
      calc(100% - 10px) 55%;
    background-size:6px 6px;
    background-repeat:no-repeat;
  }
  .rm-zona-select:focus{
    border-color:#f9735b;
    box-shadow:0 0 0 1px rgba(248,113,113,0.4);
  }

  .rm-header-right{
    min-width:40px;
  }

  /* Popup lateral */
  .menu-popup{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.6);
    display:flex;
    justify-content:flex-start;
    align-items:stretch;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:45;
  }
  .menu-popup.open{
    opacity:1;
    pointer-events:auto;
  }
  .menu-popup-inner{
    width:240px;
    max-width:80%;
    background:#020617;
    color:#f9fafb;
    padding:14px 12px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .menu-popup-close{
    align-self:flex-end;
    background:none;
    border:none;
    color:#e5e7eb;
    font-size:18px;
    cursor:pointer;
    margin-bottom:4px;
  }
  .menu-popup-title{
    font-size:13px;
    margin-bottom:4px;
  }
  .menu-popup-nav a{
    display:block;
    padding:5px 4px;
    color:#e5e7eb;
    text-decoration:none;
    border-radius:6px;
    font-size:13px;
  }
  .menu-popup-nav a:hover{
    background:rgba(148,163,184,0.25);
  }

  @media(max-width:900px){
    .rm-header-inner{
      padding:0 12px;
      gap:10px;
    }
    .rm-header-center{
      order:3;
      width:100%;
      align-items:flex-start;
    }
  }
</style>
