<style>

    justify-content:center;
    padding:10px 0 8px;
    background:radial-gradient(circle at 0 0,#0f172a 0,#020617 46%,#020617 100%);
    color:#f9fafb;
    border-bottom:1px solid rgba(148,163,184,0.5);
  }
  .rm-header-inner{
    width:100%;
    max-width:1120px;

    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .rm-brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;

  .rm-brand-left{
    display:flex;
    align-items:center;

  }

  .btn-menu{
    background:rgba(15,23,42,0.9);

    font-size:15px;

    box-shadow:0 0 0 1px rgba(15,23,42,0.4);
  }
  .btn-menu:hover{
    background:rgba(15,23,42,1);
  }

  .rm-logo-badge{

    border-radius:999px;
    background:radial-gradient(circle at 30% 0,#f9735b 0,#b91c1c 40%,#7f1d1d 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 2px rgba(15,23,42,0.95),0 0 18px rgba(248,113,113,0.55);
  }
  .rm-logo{
    width:22px;
    height:22px;
    border-radius:999px;
    border:1px solid rgba(249,250,251,0.65);
  }

  .rm-title-block{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#e5e7eb;
  }

    }
