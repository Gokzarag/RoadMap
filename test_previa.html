<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test PREVIA</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <h1>Test PREVIA</h1>

  <input type="file" id="file" accept=".txt,.csv">
  <button id="btn">Leer</button>

  <pre id="out"></pre>

  <script>
    var input = document.getElementById('file');
    var btn   = document.getElementById('btn');
    var out   = document.getElementById('out');

    btn.addEventListener('click', function () {
      var file = input.files[0];
      if (!file) {
        alert('Selecciona PREVIA.TXT');
        return;
      }

      Papa.parse(file, {
        header: false,
        skipEmptyLines: false,
        delimiter: '\t',
        complete: function (res) {
          var rows = res.data;
          var txt = 'Filas leidas: ' + rows.length + '\ln';

          for (var i = 0; i < 3 && i < rows.length; i++) {
            var r = rows[i];
            var canal = (r[1]  || '').toString().trim();
            var cod   = (r[6]  || '').toString().trim();
            var fecha = (r[17] || '').toString().trim();
            var kg    = (r[18] || '').toString().trim();
            txt += 'Fila ' + i + ': canal=' + canal +
                   ' | cod=' + cod +
                   ' | fecha=' + fecha +
                   ' | kg=' + kg + '\ln';
          }

          out.textContent = txt;
        },
        error: function (err) {
          out.textContent = 'Error: ' + err;
        }
      });
    });
  </script>
</body>
</html>
