<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - Agenda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" />
  <style>
    :root {
      --sidebar-bg: #1f2933;
      --sidebar-accent: #f9735b;
      --sidebar-accent-soft: #fde3dd;
      --sidebar-text: #f9fafb;
      --sidebar-muted: #9ca3af;
      --main-bg: #f4f5f7;
      --card-bg: #ffffff;
      --border-soft: #e5e7eb;
      --text-main: #111827;
      --text-muted: #6b7280;
      --font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--main-bg);
      color: var(--text-main);
      min-height: 100vh;
    }
    .layout {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }
    .sidebar {
      width: 235px;
      background: linear-gradient(180deg, #111827, #1f2933);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      padding: 14px 14px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sb-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .sb-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(249,250,251,0.3);
      box-shadow: 0 0 12px rgba(249,115,91,0.7);
    }
    .sb-title { display: flex; flex-direction: column; }
    .sb-title span:nth-child(1) {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sidebar-muted);
    }
    .sb-title span:nth-child(2) {
      font-size: 15px;
      font-weight: 700;
    }
    .sb-section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--sidebar-muted);
      margin: 12px 0 6px;
    }
    .zona-toggle {
      background: rgba(15,23,42,0.9);
      border-radius: 8px;
      padding: 8px 9px;
      border: 1px solid rgba(249,250,251,0.06);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11.5px;
    }
    .zona-toggle-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--sidebar-muted);
    }
    .zona-options {
      display: flex;
      gap: 6px;
    }
    .zona-pill {
      flex: 1;
      border-radius: 999px;
      padding: 5px 6px;
      text-align: center;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid rgba(249,250,251,0.16);
      color: var(--sidebar-muted);
      background: rgba(15,23,42,0.8);
      transition: all 0.2s;
    }
    .zona-pill.active {
      background: var(--sidebar-accent);
      color: #111827;
      border-color: var(--sidebar-accent-soft);
      box-shadow: 0 0 0 1px rgba(254,202,202,0.3);
      font-weight: 600;
    }
    .menu {
      margin-top: 10px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
    }
    .menu a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      color: var(--sidebar-text);
      text-decoration: none;
      border-radius: 7px;
      border: 1px solid transparent;
      transition: background .18s, border-color .18s, transform .12s;
      font-size: 13px;
    }
    .menu a .icon {
      font-size: 15px;
      width: 18px;
      text-align: center;
    }
    .menu a:hover {
      background: rgba(31,41,55,0.9);
      border-color: rgba(249,250,251,0.08);
      transform: translateX(1px);
    }
    .menu a.primary {
      background: rgba(17,24,39,0.95);
      border-color: rgba(249,250,251,0.14);
    }
    .menu a.active {
      background: rgba(249,115,91,0.12);
      border-color: var(--sidebar-accent-soft);
    }
    .sb-footer {
      margin-top: auto;
      font-size: 11px;
      color: var(--sidebar-muted);
      border-top: 1px solid rgba(55,65,81,0.9);
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sb-footer a {
      color: var(--sidebar-accent-soft);
      text-decoration: none;
      font-size: 12px;
    }
    .sb-footer a:hover { text-decoration: underline; }

    .main {
      flex: 1;
      padding: 18px;
      overflow: auto;
    }
    .card {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px 20px 20px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 10px 35px rgba(15,23,42,0.12);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .card-header-left h1 {
      font-size: 18px;
      margin-bottom: 4px;
    }
    .card-header-left p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .badge-zona {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--sidebar-accent-soft);
      color: #7c2d12;
      border: 1px solid #fed7c2;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: fit-content;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .filters label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filters input,
    .filters select {
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid var(--border-soft);
      font-size: 13px;
    }
    .table-wrapper {
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    thead {
      background: #f9fafb;
    }
    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      white-space: nowrap;
    }
    tbody tr:nth-child(even) {
      background: #f9fafb;
    }
    tbody tr:hover {
      background: #fef2f2;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 11px;
      background: #eef2ff;
      color: #3730a3;
    }

    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        gap: 8px;
      }
      .sb-section-label { display: none; }
      .zona-toggle {
        flex-direction: row;
        align-items: center;
        padding: 6px 7px;
      }
      .zona-toggle-header { display: none; }
      .zona-options { gap: 4px; }
      .zona-pill { padding: 4px 6px; font-size: 10px; }
      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        margin-top: 0;
        gap: 4px;
      }
      .menu a { padding: 4px 6px; font-size: 11px; }
      .sb-footer { display: none; }
      .main { padding: 10px 8px 12px; }
      .card { padding: 14px 14px 16px; }
    }
    @media (max-width: 480px) {
      .menu a .icon { display: none; }
      .menu a span { font-size: 10px; }
      .zona-pill { font-size: 9px; }
      .card-header-left h1 { font-size: 16px; }
      .card-header-left p { font-size: 12px; }
      th, td { white-space: normal; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-header">
      <img src="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" class="sb-logo" alt="MapTrack" />
      <div class="sb-title">
        <span>RoadMap</span>
        <span>Distribution Platform</span>
      </div>
    </div>

    <div class="sb-section-label">Oficina</div>
    <div class="zona-toggle">
      <div class="zona-toggle-header">
        <span>Selecciona zona activa</span>
      </div>
      <div class="zona-options">
        <button class="zona-pill" id="zona-ate" onclick="setZona('0374')">Cedi Ate</button>
        <button class="zona-pill" id="zona-chorr" onclick="setZona('0752')">Cadi Chorrillos</button>
      </div>
    </div>

    <div class="sb-section-label">Módulos</div>
    <ul class="menu">
      <li><a href="index.html"><span class="icon">🏠</span><span>Inicio</span></a></li>
      <li><a href="agenda.html" class="active"><span class="icon">📅</span><span>Agenda</span></a></li>
      <li><a href="planos.html"><span class="icon">🗺️</span><span>Planos</span></a></li>
      <li><a href="ubicame.html"><span class="icon">📍</span><span>Ubícame</span></a></li>
      <li><a href="documentos.html"><span class="icon">📄</span><span>Documentos</span></a></li>
    </ul>

    <div class="sb-footer">
      <span>v2.1</span>
      <a href="https://t.me/MapTrackbot" target="_blank" rel="noopener">Telegram Bot</a>
    </div>
  </aside>

  <main class="main">
    <div class="card">
      <div class="card-header">
        <div class="card-header-left">
          <h1>Agenda diaria</h1>
          <p>Lista filtrable de entregas por cliente, placa y ruta de venta.</p>
        </div>
        <div class="badge-zona">
          Zona activa:
          <strong id="badge-zona-text">...</strong>
        </div>
      </div>

      <div class="filters">
        <label>
          Fecha entrega
          <input type="date" id="f-fecha" />
        </label>
        <label>
          Cliente
          <input type="text" id="f-cliente" placeholder="Nombre o código" />
        </label>
        <label>
          Placa / Vehículo
          <input type="text" id="f-placa" placeholder="Ej. CHQ-902" />
        </label>
        <label>
          Ruta venta
          <input type="text" id="f-ruta" placeholder="Ruta" />
        </label>
        <label>
          Estado
          <select id="f-estado">
            <option value="">Todos</option>
            <option value="pendiente">Pendiente</option>
            <option value="en_ruta">En ruta</option>
            <option value="entregado">Entregado</option>
          </select>
        </label>
      </div>

      <div class="table-wrapper">
        <table id="agenda-table">
          <thead>
          <tr>
            <th>Fecha</th>
            <th>Vehículo</th>
            <th>Cliente</th>
            <th>Ciudad</th>
            <th>Ruta</th>
            <th>Kilos</th>
            <th>Estado</th>
          </tr>
          </thead>
          <tbody>
          <!-- Aquí luego llenas con JS usando el mismo CSV que ya usas -->
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  function getZona() {
    return localStorage.getItem('maptrack_zona') || '0752';
  }
  function setZona(z) {
    localStorage.setItem('maptrack_zona', z);
    pintarZona();
  }
  function pintarZona() {
    const z = getZona();
    const ate = document.getElementById('zona-ate');
    const ch = document.getElementById('zona-chorr');
    if (ate && ch) {
      ate.classList.toggle('active', z === '0374');
      ch.classList.toggle('active', z === '0752');
    }
    const label = z === '0752' ? 'Cadi Chorrillos' : 'Cedi Ate';
    const badge = document.getElementById('badge-zona-text');
    if (badge) badge.textContent = label;
  }
  document.addEventListener('DOMContentLoaded', pintarZona);
</script>
</body>
</html>
