<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - Agenda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" />

  <!-- Estilos base iguales a index -->
  <style>
    :root {
      --sidebar-bg: #1f2933;
      --sidebar-accent: #f9735b;
      --sidebar-accent-soft: #fde3dd;
      --sidebar-text: #f9fafb;
      --sidebar-muted: #9ca3af;
      --main-bg: #f4f5f7;
      --card-bg: #ffffff;
      --border-soft: #e5e7eb;
      --text-main: #111827;
      --text-muted: #6b7280;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background: var(--main-bg);
      color: var(--text-main);
      min-height: 100vh;
    }

    .layout {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* Contenedor donde se inyecta el sidebar.html */
    #sidebar-container {
      width: 235px;
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      padding: 18px 18px 18px;
      overflow: auto;
    }

    /* Tarjetas y cabeceras similares a index */
    .card {
      max-width: 1100px;
      margin: 0 auto 16px;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px 18px 18px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.12);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .card-header h1 {
      font-size: 18px;
      margin-bottom: 2px;
    }

    .card-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .badge-zona {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--sidebar-accent-soft);
      color: #7c2d12;
      border: 1px solid #fed7c2;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-zona strong {
      font-weight: 600;
    }

    /* Controles de filtros / resumen */
    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 12px;
      align-items: center;
    }

    .filters-bar label {
      font-weight: 600;
      margin-right: 4px;
    }

    .filters-bar select,
    .filters-bar input {
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid var(--border-soft);
      font-size: 12px;
    }

    .filters-bar button {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #111827;
      color: #f9fafb;
      font-size: 12px;
      cursor: pointer;
    }

    .filters-bar button:hover {
      opacity: 0.9;
    }

    /* Tabla de agenda */
    .agenda-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 8px;
    }

    .agenda-table thead {
      background: #f9fafb;
    }

    .agenda-table th,
    .agenda-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      white-space: nowrap;
    }

    .agenda-table th {
      font-weight: 600;
      color: #374151;
      font-size: 11px;
    }

    .agenda-table tbody tr:nth-child(even) {
      background: #f9fafb;
    }

    .agenda-table tbody tr:hover {
      background: #eef2ff;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .chip.primary {
      border-color: rgba(249, 115, 91, 0.35);
      background: rgba(254, 242, 242, 0.9);
      color: #7c2d12;
    }

    /* Paginación / resumen inferior */
    .agenda-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .agenda-footer button {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      font-size: 11px;
      cursor: pointer;
    }

    .agenda-footer button:hover {
      background: #f3f4f6;
    }

    /* Responsive similar a index */
    @media (max-width: 900px) {
      #sidebar-container {
        width: 100%;
      }
      .layout {
        flex-direction: column;
      }
      .main {
        padding: 10px 8px 12px;
      }
      .card {
        padding: 14px 14px 16px;
        margin-bottom: 10px;
      }
      .agenda-table {
        font-size: 11px;
      }
      .agenda-table th,
      .agenda-table td {
        padding: 4px 6px;
      }
    }
  </style>

  <!-- Scripts compartidos -->
  <script src="layout.js" defer></script>
  <script src="kpi.js" defer></script>

  <!-- Script propio de agenda: reutiliza tu lógica existente -->
  <script defer>
    // aquí pegamos la lógica JS que ya tenía agenda.html (filtros, carga de CSV, etc.)
    // Suponiendo que usabas funciones como loadAgenda(), filtrar(), etc.,
    // simplemente traslada ese código aquí sin cambiar nombres ni selectores.

    // EJEMPLO de hook al DOMContentLoaded si ya lo tienes:
    document.addEventListener('DOMContentLoaded', () => {
      // cargar sidebar
      if (typeof loadSidebar === 'function') {
        loadSidebar('agenda');
      }

      // llamar tu inicializador original de la agenda si existe
      if (typeof initAgenda === 'function') {
        initAgenda();
      }
    });
  </script>
</head>

<body>
  <div class="layout">
    <!-- Sidebar dinámico -->
    <div id="sidebar-container"></div>

    <!-- Contenido principal -->
    <main class="main">

      <!-- Cabecera de la agenda -->
      <section class="card">
        <div class="card-header">
          <div>
            <h1>Agenda diaria</h1>
            <p>Lista filtrable de entregas por cliente, placa y ruta de venta, con fecha de entrega visible.</p>
          </div>
          <div class="badge-zona">
            Zona activa:
            <strong id="badge-zona-agenda">-</strong>
          </div>
        </div>

        <!-- Barra de filtros superior (ajusta ids/nombres a lo que ya uses) -->
        <div class="filters-bar">
          <div>
            <label for="f-fecha">Fecha:</label>
            <input type="date" id="f-fecha" />
          </div>
          <div>
            <label for="f-placa">Placa:</label>
            <input type="text" id="f-placa" placeholder="Ej: ABC-123" />
          </div>
          <div>
            <label for="f-cliente">Cliente:</label>
            <input type="text" id="f-cliente" placeholder="Nombre o código" />
          </div>
          <div>
            <label for="f-ruta">Ruta:</label>
            <input type="text" id="f-ruta" placeholder="Ruta de venta" />
          </div>
          <button id="btn-filtrar">Aplicar filtros</button>
          <button id="btn-limpiar" style="background:#ffffff;color:#111827;">Limpiar</button>
        </div>

        <!-- Resumen rápido -->
        <div class="filters-bar" style="margin-bottom: 4px;">
          <span class="chip primary" id="res-kg">Kg planificados: 0</span>
          <span class="chip" id="res-cli">Clientes: 0</span>
          <span class="chip" id="res-unid">Unidades: 0</span>
        </div>

        <!-- Tabla de agenda (usa los mismos ids que ya tenías) -->
        <div style="overflow-x:auto; margin-top:6px;">
          <table class="agenda-table" id="tabla-agenda">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Placa</th>
                <th>Cliente</th>
                <th>Ruta</th>
                <th>Pedido</th>
                <th>Kg</th>
                <th>Ciudad</th>
                <th>Dirección</th>
              </tr>
            </thead>
            <tbody>
              <!-- Las filas se llenan vía JS como antes -->
            </tbody>
          </table>
        </div>

        <!-- Pie de tabla: paginación / info -->
        <div class="agenda-footer">
          <span id="info-registros">0 registros</span>
          <div>
            <button id="pag-prev">&laquo; Anterior</button>
            <button id="pag-next">Siguiente &raquo;</button>
          </div>
        </div>
      </section>

    </main>
  </div>
</body>
</html>
