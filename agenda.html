<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - Agenda diaria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root{
      --sidebar-accent:#f9735b;
      --sidebar-accent-soft:#fde3dd;
      --main-bg:#f4f5f7;
      --card-bg:#ffffff;
      --border-soft:#e5e7eb;
      --text-main:#111827;
      --text-muted:#6b7280;
      --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      --content-max:1120px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font);
      background:var(--main-bg);
      color:var(--text-main);
      min-height:100vh;
      margin:0;
    }
    .layout{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    .main{
      flex:1;
      padding:60px 16px 16px;
      display:flex;
      justify-content:center;
    }
    .main-inner{
      width:100%;
      max-width:var(--content-max);
    }

    /* Encabezado común cargado desde sidebar.html */
    .rm-header{
      position:fixed;
      top:0;
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:6px 16px;
      background:#020617;
      color:#f9fafb;
      border-bottom:1px solid rgba(148,163,184,0.4);
    }
    .rm-header-inner{
      width:100%;
      max-width:var(--content-max);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .rm-header-left{display:flex;align-items:center;gap:8px;}
    .rm-logo{
      width:26px;height:26px;border-radius:8px;
      border:1px solid rgba(249,250,251,0.3);
    }
    .rm-title{display:flex;flex-direction:column;}
    .rm-title span:first-child{
      font-size:10px;text-transform:uppercase;
      letter-spacing:0.12em;color:#9ca3af;
    }
    .rm-title span:last-child{
      font-size:13px;font-weight:600;
    }
    .rm-header-center{
      display:flex;flex-direction:column;align-items:center;gap:2px;
    }
    .rm-label{
      font-size:10px;text-transform:uppercase;color:#9ca3af;
    }
    .rm-zona{display:flex;gap:4px;}
    .zona-pill{
      border-radius:999px;
      padding:3px 8px;
      font-size:11px;
      border:1px solid rgba(249,250,251,0.16);
      background:#0f172a;
      color:#e5e7eb;
      cursor:pointer;
      white-space:nowrap;
    }
    .zona-pill.active{
      background:#f9735b;
      color:#111827;
    }
    .rm-header-right .btn-menu{
      background:none;
      border:1px solid rgba(249,250,251,0.4);
      color:#f9fafb;
      border-radius:6px;
      padding:3px 8px;
      font-size:16px;
      cursor:pointer;
    }

    /* Popup off-canvas de módulos */
    .menu-popup{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,0.6);
      display:flex;
      justify-content:flex-start;
      align-items:stretch;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      z-index:40;
    }
    .menu-popup.open{
      opacity:1;
      pointer-events:auto;
    }
    .menu-popup-inner{
      width:240px;
      max-width:80%;
      background:#020617;
      color:#f9fafb;
      padding:14px 12px 16px;
      box-shadow:0 8px 30px rgba(0,0,0,0.5);
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .menu-popup-close{
      align-self:flex-end;
      background:none;
      border:none;
      color:#e5e7eb;
      font-size:18px;
      cursor:pointer;
      margin-bottom:4px;
    }
    .menu-popup-title{
      font-size:13px;
      margin-bottom:4px;
    }
    .menu-popup-nav a{
      display:block;
      padding:5px 4px;
      color:#e5e7eb;
      text-decoration:none;
      border-radius:6px;
      font-size:13px;
    }
    .menu-popup-nav a:hover{
      background:rgba(148,163,184,0.25);
    }

    @media(max-width:900px){
      .rm-header-inner{ flex-wrap:wrap; }
      .rm-header-center{
        order:3;width:100%;align-items:flex-start;
      }
    }

    /* Tarjeta principal de Agenda */
    .agenda-card{
      background:var(--card-bg);
      border-radius:12px;
      padding:14px 16px 16px;
      border:1px solid var(--border-soft);
      box-shadow:0 6px 20px rgba(15,23,42,0.08);
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .agenda-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
    }
    .agenda-header-left h1{
      font-size:17px;
      margin-bottom:3px;
    }
    .agenda-header-left p{
      font-size:13px;
      color:var(--text-muted);
    }
    .badge-zona{
      font-size:11px;
      padding:3px 7px;
      border-radius:999px;
      background:var(--sidebar-accent-soft);
      color:#7c2d12;
      border:1px solid #fed7c2;
      display:inline-flex;
      align-items:center;
      gap:4px;
    }
    .badge-fecha{
      font-size:11px;
      padding:3px 7px;
      border-radius:999px;
      background:#e5f3ff;
      color:#1d4ed8;
      border:1px solid #bfdbfe;
      font-family:monospace;
    }
    .buscador-container{
      margin-top:6px;
      max-width:260px;
    }
    .search-box{
      display:flex;
      align-items:center;
      background:#f9fafb;
      border:1px solid #d1d5db;
      border-radius:999px;
      overflow:hidden;
    }
    .search-box input{
      flex-grow:1;
      font-size:12px;
      padding:5px 8px;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text-main);
    }
    .search-box input::placeholder{
      color:#9ca3af;
      font-size:12px;
    }
    .search-box button{
      font-size:11px;
      padding:5px 10px;
      color:#111827;
      background:var(--sidebar-accent);
      border:none;
      cursor:pointer;
      font-weight:600;
      border-radius:999px;
      margin-right:3px;
    }
    .search-box button:hover{ opacity:.93; }

    .table-wrapper{
      border-radius:10px;
      border:1px solid var(--border-soft);
      background:#f9fafb;
      overflow:auto;
      box-shadow:inset 0 0 6px rgba(15,23,42,0.1);
    }
    table{
      border-collapse:separate;
      border-spacing:0 2px;
      width:100%;
      min-width:520px;
      font-size:11px;
      background:white;
    }
    thead th{
      position:sticky;
      top:0;
      background:#f9735b;
      color:white;
      text-align:left;
      padding:5px 8px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:0.04em;
      z-index:1;
    }
    tbody td{
      padding:4px 8px;
      white-space:nowrap;
      border-top:1px solid #f3f4f6;
      border-bottom:1px solid #f3f4f6;
    }
    tbody tr:nth-child(even){background:#f9fafb;}
    tbody tr:hover{background:#fee2e2;}
    tr.resaltado{
      background:#ffe4e6 !important;
      font-weight:600;
      color:#b91c1c;
    }

    @media(max-width:900px){
      .main{ padding:10px 10px 14px; }
    }
    @media(max-width:480px){
      .agenda-header-left h1{font-size:15px;}
      .agenda-header-left p{font-size:12px;}
      .badge-zona,.badge-fecha{font-size:10px;}
      table{font-size:10px;}
    }
  </style>
</head>
<body>
<div class="layout">
  <!-- aquí se inyecta sidebar.html (encabezado + popup) -->
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="main-inner">
      <section class="agenda-card">
        <header class="agenda-header">
          <div class="agenda-header-left">
            <h1>Agenda de entregas</h1>
            <p>Visualiza y filtra la agenda de clientes por zona, placa, solicitante y otros campos clave.</p>
            <div class="buscador-container">
              <div class="search-box">
                <input type="text" id="buscador-principal" placeholder="Buscar en agenda..." autocomplete="off" spellcheck="false" />
                <button type="button" onclick="nuevaBusqueda()">Nueva</button>
              </div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
            <span class="badge-zona">Zona activa: <strong id="badge-zona-text">-</strong></span>
            <span class="badge-fecha" id="fecha-entrega-badge">--/--/----</span>
          </div>
        </header>

        <div class="table-wrapper">
          <table id="agenda-table">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Solicitante</th>
                <th>Ruta Venta</th>
                <th>Placa</th>
                <th>Asignación</th>
                <th>Teléfono</th>
                <th>Dirección</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- lógica de zona activa (igual que index, pero usable por Agenda) -->
<script>
function getZona(){
  return localStorage.getItem('maptrack_zona') || '0752';
}
function setZona(z){
  localStorage.setItem('maptrack_zona', z);
  pintarZona();
  filtrarZonaYRender();
}
function pintarZona(){
  const z = getZona();
  const ate = document.getElementById('zona-ate');
  const ch = document.getElementById('zona-chorr');
  if (ate && ch){
    ate.classList.toggle('active', z === '0374');
    ch.classList.toggle('active', z === '0752');
  }
  const label = (z === '0752' ? 'Cadi Chorrillos' : 'Cedi Ate');
  const badge = document.getElementById('badge-zona-text');
  if (badge) badge.textContent = label;
}
</script>

<script>
const COL_PLACA = 'Vehicle Key/Placa';
const COL_CODIGO_CLIENTE = 'Customer Account # / Cliente';
const COL_NOMBRE_CLIENTE = 'Customer Name/Solic';
const COL_ERROR = 'Customer Name2';
const COL_CITY = 'City';
const COL_ADDRESS = 'Address';
const COL_FECHA = 'Fecha de Entrega';
const COL_CONSIDERA = 'Considera';
const COL_LAT = 'Latitude';
const COL_LNG = 'Longitude';
const CSV_URL = 'https://raw.githubusercontent.com/Gokzarag/MapTrack/main/MapTrack_V2.1.csv';

let dataRowsRaw = [];
let dataRows = [];
let buscadorGlobal = '';

function toDDMMYYYY(fechaStr) {
  if (!fechaStr) return '';
  if (/^d{4}-d{1,2}-d{1,2}$/.test(fechaStr.trim())) {
    let [a,m,d]=fechaStr.trim().split('-');
    return `${d.padStart(2,'0')}/${m.padStart(2,'0')}/${a}`;
  }
  let sep = fechaStr.includes('/') ? '/' : '-';
  let [p1,p2,p3] = fechaStr.trim().split(sep);
  if (p3 && p3.length===4){
    let d=parseInt(p1),m=parseInt(p2),y=parseInt(p3);
    if (m>12)[d,m]=[m,d];
    return `${d.toString().padStart(2,'0')}/${m.toString().padStart(2,'0')}/${y}`;
  }
  return fechaStr;
}

function getUnique(arr) {
  const seen = new Set();
  return arr.filter(row => {
    const key = [
      row.Cliente, row.Solicitante, row.RutaVenta,
      row.Placa, row.Asignacion, row.Telefono, row.Direccion
    ].join('|').toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function mostrarFechaEntrega(rows) {
  let fechas = [...new Set(rows.map(r => r.FechaEntrega).filter(f => f))];
  fechas.sort((a, b) => {
    let [da, ma, aa] = a.split('/').map(Number);
    let [db, mb, ab] = b.split('/').map(Number);
    let dA = new Date(aa, ma - 1, da);
    let dB = new Date(ab, mb - 1, db);
    return dA - dB;
  });
  let fechaMostrar = fechas.length ? fechas[0] : '';
  document.getElementById('fecha-entrega-badge').textContent =
    fechaMostrar || '--/--/----';
}

function match(row) {
  if (buscadorGlobal) {
    let val = [
      row.Cliente, row.Solicitante, row.RutaVenta, row.Placa,
      row.Asignacion, row.Telefono, row.Direccion, row.Pedido
    ].join(' ').toLowerCase();
    if (!val.includes(buscadorGlobal)) return false;
  }
  return true;
}

function renderTable() {
  let tbody = document.querySelector('#agenda-table tbody');
  let fragment = document.createDocumentFragment();
  let rowsShow = dataRows.filter(row => match(row));
  for (let i = 0; i < rowsShow.length && i < 250; i++) {
    let row = rowsShow[i];
    let tr = document.createElement('tr');
    tr.innerHTML = `
      <td title="${row.Cliente}">${row.Cliente}</td>
      <td title="${row.Solicitante}">${row.Solicitante}</td>
      <td title="${row.RutaVenta}">${row.RutaVenta}</td>
      <td title="${row.Placa}">${row.Placa}</td>
      <td title="${row.Asignacion}">${row.Asignacion}</td>
      <td title="${row.Telefono}">${row.Telefono}</td>
      <td title="${row.Direccion.replace(/<.*?>/g,'')}">${row.Direccion}</td>
    `;
    tr.addEventListener('touchstart', ()=> tr.classList.add('resaltado'));
    tr.addEventListener('touchend', ()=> setTimeout(()=>tr.classList.remove('resaltado'),120));
    fragment.appendChild(tr);
  }
  tbody.innerHTML = '';
  tbody.appendChild(fragment);
}

function filtrarZonaYRender() {
  const zona = getZona();
  if(zona === '0752') {
    dataRows = getUnique(dataRowsRaw.filter(r => r.Considera && r.Considera.trim() === '0752'));
  } else {
    dataRows = getUnique(dataRowsRaw.filter(r => r.Considera && r.Considera.trim() !== '0752'));
  }
  mostrarFechaEntrega(dataRows);
  renderTable();
}

function onGlobalSearchInput(){
  buscadorGlobal = document.getElementById('buscador-principal').value.trim().toLowerCase();
  renderTable();
}
function nuevaBusqueda(){
  buscadorGlobal = '';
  document.getElementById('buscador-principal').value = '';
  renderTable();
}

function loadCSV() {
  Papa.parse(CSV_URL, {
    download: true, header: true, skipEmptyLines: true,
    complete: function (results) {
      const rows = results.data;
      dataRowsRaw = rows.map(row => {
        let E = row[COL_NOMBRE_CLIENTE]||'';
        let F = row[COL_ERROR]||'';
        let fullSolic = (F && !['0', '#N/A', '(blank)', '', ' '].includes(F))
          ? `${E} - ${F}` : E;
        let address = row[COL_ADDRESS]||'';
        let city = row[COL_CITY]||'';
        let dirCity = address + (city ? ' - ' + city : '');
        let lat = row[COL_LAT]||'';
        let lng = row[COL_LNG]||'';
        let mapLink = (lat && lng)
          ? `<a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank" rel="noopener">${dirCity}</a>`
          : dirCity;
        let fecha = toDDMMYYYY(row[COL_FECHA]||'');
        let asignacion = row['Asignación']||row['Asignacion']||'';
        let telefono = row['Teléfono']||row['Telefono']||row['Phone']||'';
        return {
          raw: row,
          Cliente: row[COL_CODIGO_CLIENTE]||'',
          Solicitante: fullSolic,
          RutaVenta: row['RUTA VENTA']||row['Ruta Venta']||'',
          Placa: row[COL_PLACA]||'',
          Asignacion: asignacion,
          Telefono: telefono,
          Direccion: mapLink,
          FechaEntrega: fecha,
          Pedido: row['#Pedido'] || row['Pedido'] || '',
          Considera: row[COL_CONSIDERA]||''
        };
      });
      filtrarZonaYRender();
    }
  });
}
</script>

<script src="kpi.js"></script>
<script src="layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  if (typeof loadSidebar === 'function') {
    loadSidebar('agenda');
  }
  pintarZona();
  const input = document.getElementById('buscador-principal');
  if (input) input.addEventListener('input', onGlobalSearchInput);
  loadCSV();
});
</script>

</body>
</html>
