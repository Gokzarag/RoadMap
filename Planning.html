<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - Filtros Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" />

  <!-- Librerías -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root{
      --sidebar-accent:#f9735b;
      --main-bg:#f4f5f7;
      --card-bg:#ffffff;
      --border-soft:#e5e7eb;
      --text-main:#111827;
      --text-muted:#6b7280;
      --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      --content-max:1120px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font);
      background:var(--main-bg);
      color:var(--text-main);
      min-height:100vh;
      margin:0;
    }
    .layout{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    .main{
      flex:1;
      padding:72px 12px 12px;
      display:flex;
      justify-content:center;
    }
    .main-inner{
      width:100%;
      max-width:var(--content-max);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .panel{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
      background:var(--card-bg);
      border-radius:14px;
      padding:14px 14px 16px;
      border:1px solid var(--border-soft);
      box-shadow:0 6px 20px rgba(15,23,42,0.08);
      min-height:0;
    }
    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
    }
    .panel-title h1{
      font-size:18px;
      margin-bottom:4px;
    }
    .panel-title p{
      font-size:12px;
      color:var(--text-muted);
    }
    .panel-meta{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:4px;
      font-size:11px;
    }

    .uploader-box{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:8px;
      padding:10px;
      border-radius:10px;
      border:1px solid var(--border-soft);
      background:#f9fafb;
      font-size:12px;
    }
    .uploader-box label{
      font-weight:600;
      color:#4b5563;
    }
    .uploader-box input[type="file"]{
      font-size:12px;
    }
    .btn{
      border:none;
      border-radius:999px;
      padding:6px 12px;
      font-size:12px;
      cursor:pointer;
      font-weight:600;
      white-space:nowrap;
    }
    .btn-primary{
      background:var(--sidebar-accent);
      color:#111827;
    }
    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status-text{
      font-size:11px;
      color:var(--text-muted);
    }

    .results-summary{
      font-size:12px;
      color:var(--text-muted);
    }

    .table-wrapper{
      margin-top:6px;
      border-radius:10px;
      border:1px solid var(--border-soft);
      overflow:auto;
      max-height:60vh;
      background:#f9fafb;
    }
    table{
      width:100%;
      border-collapse:collapse;
      font-size:11px;
    }
    thead{
      position:sticky;
      top:0;
      background:#111827;
      color:#f9fafb;
      z-index:1;
    }
    th,td{
      padding:4px 6px;
      border-bottom:1px solid #e5e7eb;
      text-align:left;
      white-space:nowrap;
    }
    tbody tr:nth-child(even){
      background:#f3f4f6;
    }
  </style>
</head>

<body>
<div class="layout">
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="main-inner">
      <section class="panel">
        <header class="panel-header">
          <div class="panel-title">
            <h1>Filtros Planner</h1>
            <p>Sube el archivo del planner y cruza los clientes con el catálogo Sigma.</p>
          </div>
          <div class="panel-meta">
            <span class="status-text" id="status-text">Catálogo Sigma: cargando…</span>
          </div>
        </header>

        <div class="uploader-box">
          <label for="plannerFile">Archivo Planner (.csv, .txt, .xls, .xlsx):</label>
          <input type="file" id="plannerFile" accept=".csv,.txt,.xls,.xlsx" />
          <button class="btn btn-primary" id="btnProcesar" disabled>Procesar</button>
        </div>

        <div class="results-summary" id="results-summary"></div>

        <div class="table-wrapper" id="table-wrapper" style="display:none;">
          <table id="result-table">
            <thead>
              <tr>
                <th>Canal</th>
                <th>Código</th>
                <th>Cliente</th>
                <th>Ruta ventas</th>
                <th>Día despacho</th>
                <th>Kg pedido</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
const SIGMA_CSV_URL = 'https://raw.githubusercontent.com/Gokzarag/RoadMap/main/CatalogoSigma_SAMPLE.csv';
const DEBUG = false; // true para ver trazas en consola

let sigmaByDeudor = new Map(); // deudor -> fila catálogo

document.addEventListener('DOMContentLoaded', ()=>{
  if (typeof loadSidebar === 'function') {
    loadSidebar('planner');
  }
  cargarCatalogoSigma();
  configurarEventos();
});

function cargarCatalogoSigma(){
  const status = document.getElementById('status-text');
  status.textContent = 'Catálogo Sigma: cargando…';

  Papa.parse(SIGMA_CSV_URL,{
    download:true,
    header:true,            // CatalogoSigma_SAMPLE tiene cabecera
    skipEmptyLines:true,
    complete:(res)=>{
      sigmaByDeudor.clear();
      res.data.forEach(row=>{
        const deudor = (row['Deudor'] || row[0] || '').toString().trim();
        if (!deudor) return;
        sigmaByDeudor.set(deudor, row);
      });
      status.textContent = `Catálogo Sigma: ${sigmaByDeudor.size} clientes cargados.`;
      if (DEBUG) console.log('Sigma SAMPLE cargado, filas:', res.data.length);
      habilitarBotonProcesar();
    },
    error:(err)=>{
      console.error('Error catálogo Sigma',err);
      status.textContent = 'Error cargando catálogo Sigma.';
    }
  });
}

function configurarEventos(){
  const fileInput   = document.getElementById('plannerFile');
  fileInput.addEventListener('change', habilitarBotonProcesar);

  document.getElementById('btnProcesar').addEventListener('click', ()=>{
    const file = fileInput.files && fileInput.files[0];
    if (!file){
      alert('Selecciona un archivo del planner.');
      return;
    }
    procesarArchivoPlanner(file);
  });
}

function habilitarBotonProcesar(){
  const fileInput = document.getElementById('plannerFile');
  const btn = document.getElementById('btnProcesar');
  const ok = sigmaByDeudor.size > 0 && fileInput.files.length > 0;
  btn.disabled = !ok;
}

function procesarArchivoPlanner(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if (DEBUG) console.log('Procesando archivo', file.name, 'ext=', ext);

  if (ext === 'csv'){
    Papa.parse(file,{
      header:false,
      skipEmptyLines:false,
      complete:(res)=>procesarFilasPlanner(res.data)
    });
  } else if (ext === 'txt'){
    Papa.parse(file,{
      header:false,
      skipEmptyLines:false,
      delimiter:'\t',   // PREVIA_SAMPLE.txt es tabulado
      complete:(res)=>procesarFilasPlanner(res.data)
    });
  } else if (ext === 'xls' || ext === 'xlsx'){
    const reader = new FileReader();
    reader.onload = (e)=>{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data,{type:'array'});
      const firstSheet = wb.SheetNames[0];
      const ws = wb.Sheets[firstSheet];
      const json = XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      procesarFilasPlanner(json);
    };
    reader.readAsArrayBuffer(file);
  } else {
    alert('Formato no soportado. Usa CSV, TXT, XLS o XLSX.');
  }
}

function obtenerLetraDiaDesdeFecha(fechaStr){
  if (!fechaStr) return '';
  fechaStr = fechaStr.toString().trim().replace(/./g,'/');
  const partes = fechaStr.split('/');
  if (partes.length !== 3) return '';
  const d = parseInt(partes[0],10);
  const m = parseInt(partes[1],10) - 1;
  const y = parseInt(partes[2],10);
  if (isNaN(d) || isNaN(m) || isNaN(y)) return '';
  const dt = new Date(y,m,d);
  if (isNaN(dt.getTime())) return '';
  const jsDay = dt.getDay(); // 0=Dom,1=Lun,2=Mar,3=Mié,4=Jue,5=Vie,6=Sab
  switch(jsDay){
    case 1: return 'L';
    case 2: return 'M';
    case 3: return 'X';
    case 4: return 'J';
    case 5: return 'V';
    case 6: return 'S';
    default: return '';
  }
}

function encontrarInicioDatos(rows){
  for (let i=0;i<rows.length;i++){
    const row = rows[i];
    const canal = (row[1] || '').toString().trim();   // B
    const codigo = (row[6] || '').toString().trim();  // G
    const fechaEntrega = (row[17] || '').toString().trim(); // R
    if (canal && codigo && fechaEntrega){
      return i;
    }
  }
  return 1;
}

function procesarFilasPlanner(rows){
  const tbody = document.querySelector('#result-table tbody');
  tbody.innerHTML = '';

  const agregados = new Map();
  const startIdx = encontrarInicioDatos(rows);

  if (DEBUG) console.log('Inicio datos en fila:', startIdx);

  for (let i=startIdx;i<rows.length;i++){
    const row = rows[i];

    const canal = (row[1] || '').toString().trim();      // B
    if (!canal || !canal.includes('DET')) continue;

    const rutaVentas    = (row[3] || '').toString().trim(); // D
    const codigo        = (row[6] || '').toString().trim(); // G
    const clienteNombre = (row[7] || '').toString().trim(); // H
    if (!codigo) continue;

    const fechaEntregaRaw = (row[17] || '').toString();     // R
    const letraDiaEntrega = obtenerLetraDiaDesdeFecha(fechaEntregaRaw);
    if (!letraDiaEntrega) continue;

    const filaSigma = sigmaByDeudor.get(codigo);
    if (!filaSigma) continue;

    // días despacho: campo FV Z3 (columna AW, índice 48); en CSV con cabecera lector lo tiene como nombre de columna
    let diasDespacho = (filaSigma['FV Z3'] || filaSigma[48] || '').toString();
    diasDespacho = diasDespacho.toUpperCase().replace(/s+/g,'').trim();
    if (!diasDespacho) continue;

    if (DEBUG && codigo === '11667295'){
      console.log('DEBUG 11667295 -> fecha:', fechaEntregaRaw,
                  'diaEntrega:', letraDiaEntrega,
                  'diasCatalogo:', diasDespacho);
    }

    const enRuta = diasDespacho.split('').some(l => l === letraDiaEntrega);
    if (enRuta) continue; // solo fuera de ruta

    const kgStr = (row[18] || '0').toString().replace(',','.');
    const kg = parseFloat(kgStr) || 0;

    let item = agregados.get(codigo);
    if (!item){
      item = {
        canal,
        codigo,
        cliente: clienteNombre,
        ruta: rutaVentas,
        diaDespacho: diasDespacho,
        kg: 0
      };
      agregados.set(codigo,item);
    }
    item.kg += kg;
  }

  const valores = Array.from(agregados.values());

  valores.forEach(item=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.canal}</td>
      <td>${item.codigo}</td>
      <td>${item.cliente}</td>
      <td>${item.ruta}</td>
      <td>${item.diaDespacho}</td>
      <td>${item.kg.toFixed(3)}</td>
    `;
    tbody.appendChild(tr);
  });

  const summary = document.getElementById('results-summary');
  document.getElementById('table-wrapper').style.display = 'block';
  summary.textContent = `Clientes DET fuera de ruta encontrados: ${valores.length}.`;
}
</script>

<script src="layout.js"></script>
</body>
</html>
