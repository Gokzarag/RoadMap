<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - Filtros Planning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/MapTrack/main/MapTrack.png" />

  <!-- Librerías -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- html2canvas para screenshot del mapa -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    :root{
      --sidebar-accent:#f9735b;
      --main-bg:#f4f5f7;
      --card-bg:#ffffff;
      --border-soft:#e5e7eb;
      --text-main:#111827;
      --text-muted:#6b7280;
      --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      --content-max:1120px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font);
      background:var(--main-bg);
      color:var(--text-main);
      min-height:100vh;
      margin:0;
    }
    .layout{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    .main{
      flex:1;
      padding:72px 12px 12px;
      display:flex;
      justify-content:center;
    }
    .main-inner{
      width:100%;
      max-width:var(--content-max);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .panel{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
      background:var(--card-bg);
      border-radius:14px;
      padding:14px 14px 18px;
      border:1px solid var(--border-soft);
      box-shadow:0 6px 20px rgba(15,23,42,0.08);
      min-height:0;
    }
    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .panel-title{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .panel-title h1{
      font-size:18px;
    }
    .panel-meta{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:4px;
      font-size:11px;
    }

    .uploader-inline{
      display:flex;
      align-items:center;
      gap:6px;
    }
    .file-label{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid #d1d5db;
      background:#ffffff;
      cursor:pointer;
      font-size:11px;
    }
    .file-label span.icon{
      font-size:13px;
    }
    #plannerFile{
      display:none;
    }

    .btn{
      border:none;
      border-radius:999px;
      padding:4px 8px;
      font-size:11px;
      cursor:pointer;
      font-weight:600;
      white-space:nowrap;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:4px;
    }
    .btn-primary{
      background:var(--sidebar-accent);
      color:#111827;
    }
    .btn-icon{
      background:#e5e7eb;
      color:#111827;
      width:24px;
      height:24px;
      border-radius:999px;
      padding:0;
      font-size:13px;
    }
    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status-text{
      font-size:11px;
      color:var(--text-muted);
    }

    .content-split{
      display:flex;
      gap:10px;
      align-items:stretch;
      height:calc(100vh - 140px);
    }
    .content-left{
      flex:1.1;
      display:flex;
      flex-direction:column;
      gap:6px;
      min-height:0;
    }
    .content-right{
      flex:1.4;
      display:flex;
      flex-direction:column;
      gap:6px;
      min-height:0;
    }

    .table-panel{
      border-radius:10px;
      border:1px solid var(--border-soft);
      padding:6px;
      background:#f9fafb;
      display:flex;
      flex-direction:column;
      gap:4px;
      height:100%;
      min-height:0;
    }
    .table-header-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:6px;
      font-size:10px;
      color:#4b5563;
    }
    .table-actions{
      display:flex;
      flex-wrap:wrap;
      gap:4px;
      justify-content:flex-end;
    }

    .table-wrapper{
      border-radius:8px;
      border:1px solid var(--border-soft);
      overflow:auto;
      flex:1;
      background:#ffffff;
      font-size:10px;
      min-height:0;
    }
    table{
      width:100%;
      border-collapse:collapse;
      font-size:10px;
    }
    thead{
      position:sticky;
      top:0;
      background:#111827;
      color:#f9fafb;
      z-index:1;
    }
    th,td{
      padding:3px 5px;
      border-bottom:1px solid #e5e7eb;
      text-align:left;
      white-space:nowrap;
    }
    tbody tr:nth-child(even){
      background:#f3f4f6;
    }
    tbody tr.highlight-row{
      outline:2px solid #f9735b;
      outline-offset:-2px;
      background:#fef3c7;
    }

    .map-panel{
      border-radius:10px;
      border:1px solid var(--border-soft);
      padding:6px;
      background:#f9fafb;
      height:100%;
      display:flex;
      flex-direction:column;
      gap:4px;
      min-height:0;
    }
    .map-title-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:10px;
      color:#4b5563;
    }
    .map-legend{
      display:flex;
      gap:6px;
      align-items:center;
      flex-wrap:wrap;
    }
    .legend-item{
      display:inline-flex;
      align-items:center;
      gap:3px;
    }
    .legend-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      display:inline-block;
    }
    .dot-blue{background:#3b82f6;border:1px solid #1d4ed8;}
    .dot-yellow{background:#facc15;border:1px solid #a16207;}
    .dot-red{background:#ef4444;border:1px solid #b91c1c;}

    #map{
      flex:1;
      border-radius:8px;
      border:1px solid var(--border-soft);
      min-height:0;
    }

    @media (max-width:900px){
      .content-split{
        flex-direction:column;
        height:auto;
      }
      .table-wrapper,#map{
        min-height:260px;
      }
    }
  </style>
</head>

<body>
<div class="layout">
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="main-inner">
      <section class="panel">
        <header class="panel-header">
          <div class="panel-title">
            <h1>Filtros Planning</h1>
            <div class="uploader-inline">
              <label class="file-label" for="plannerFile">
                <span class="icon">📂</span>
                <span id="fileNameLabel">Seleccionar archivo</span>
              </label>
              <input type="file" id="plannerFile" accept=".csv,.txt,.xls,.xlsx" />
              <button class="btn btn-primary" id="btnProcesar" disabled title="Procesar archivo">
                ▶
              </button>
            </div>
          </div>
          <div class="panel-meta">
            <span class="status-text" id="status-text">Catálogo Sigma: cargando…</span>
          </div>
        </header>

        <div class="content-split">
          <div class="content-left">
            <div class="table-panel" id="table-panel" style="display:none;">
              <div class="table-header-row">
                <span id="results-summary">Clientes DET fuera de ruta: 0 | Fecha: -</span>
                <div class="table-actions">
                  <button class="btn btn-icon" id="btnCsv" title="Descargar CSV">💾</button>
                  <button class="btn btn-icon" id="btnCopyTable" title="Copiar como tabla Excel">📋</button>
                  <button class="btn btn-icon" id="btnCopyImage" title="Copiar tabla como imagen">🖼</button>
                </div>
              </div>

              <div class="table-wrapper" id="table-wrapper">
                <table id="result-table">
                  <thead>
                    <tr>
                      <th>Canal</th>
                      <th>Código</th>
                      <th>Cliente</th>
                      <th>Ruta ventas</th>
                      <th>Día despacho</th>
                      <th>Kg pedido</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="content-right">
            <div class="map-panel" id="mapPanel">
              <div class="map-title-row">
                <div class="map-legend">
                  <span class="legend-item">
                    <span class="legend-dot dot-blue"></span><span>FSE</span>
                  </span>
                  <span class="legend-item">
                    <span class="legend-dot dot-yellow"></span><span>DET en ruta</span>
                  </span>
                  <span class="legend-item">
                    <span class="legend-dot dot-red"></span><span>DET fuera de ruta</span>
                  </span>
                </div>
                <div class="table-actions">
                  <button class="btn btn-icon" id="btnCopyMap" title="Copiar mapa como imagen">🖼</button>
                </div>
              </div>
              <div id="map"></div>
            </div>
          </div>

        </div>
      </section>
    </div>
  </main>
</div>

<script>
const SIGMA_CSV_URL = 'https://raw.githubusercontent.com/Gokzarag/MapTrack/main/Catalogo%20Sigma.csv';
const DEBUG = false;
const COL_LAT = 28;
const COL_LON = 29;

let sigmaByDeudor = new Map();
let ultimosValoresTabla = [];
let mapa = null;
let capaFSE = null;
let capaDetEnRuta = null;
let capaDetFueraRuta = null;
let markersByCodigo = new Map();

document.addEventListener('DOMContentLoaded', ()=>{
  if (typeof loadSidebar === 'function') {
    loadSidebar('planner');
  }
  initMapa();
  cargarCatalogoSigma();
  configurarEventosTabla();
  configurarEventos();
});

/* Mapa */
function initMapa(){
  mapa = L.map('map').setView([-12.0464, -77.0428], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap'
  }).addTo(mapa);
  capaFSE = L.layerGroup().addTo(mapa);
  capaDetEnRuta = L.layerGroup().addTo(mapa);
  capaDetFueraRuta = L.layerGroup().addTo(mapa);
}

/* Catálogo Sigma */
function cargarCatalogoSigma(){
  const status = document.getElementById('status-text');
  status.textContent = 'Catálogo Sigma: cargando…';

  Papa.parse(SIGMA_CSV_URL,{
    download:true,
    header:false,
    skipEmptyLines:true,
    complete:(res)=>{
      sigmaByDeudor.clear();
      res.data.forEach(row=>{
        const deudor = (row[0] || '').toString().trim();
        if (deudor){
          sigmaByDeudor.set(deudor,row);
        }
      });
      status.textContent = `Catálogo Sigma: ${sigmaByDeudor.size} clientes cargados.`;
      habilitarBotonProcesar();
    },
    error:(err)=>{
      console.error('Error catálogo Sigma',err);
      status.textContent = 'Error cargando catálogo Sigma.';
    }
  });
}

/* Eventos generales */
function configurarEventos(){
  const fileInput   = document.getElementById('plannerFile');
  const fileNameLabel = document.getElementById('fileNameLabel');

  fileInput.addEventListener('change', ()=>{
    if (fileInput.files && fileInput.files[0]){
      fileNameLabel.textContent = fileInput.files[0].name;
    } else {
      fileNameLabel.textContent = 'Seleccionar planner';
    }
    habilitarBotonProcesar();
  });

  document.getElementById('btnProcesar').addEventListener('click', ()=>{
    const file = fileInput.files && fileInput.files[0];
    if (!file){
      alert('Selecciona un archivo del planner.');
      return;
    }
    procesarArchivoPlanner(file);
  });

  document.getElementById('btnCopyMap').addEventListener('click', copiarMapaImagen);
}

function habilitarBotonProcesar(){
  const fileInput = document.getElementById('plannerFile');
  const btn = document.getElementById('btnProcesar');
  const ok = sigmaByDeudor.size > 0 && fileInput.files.length > 0;
  btn.disabled = !ok;
}

function procesarArchivoPlanner(file){
  const ext = file.name.split('.').pop().toLowerCase();

  if (ext === 'csv'){
    Papa.parse(file,{
      header:false,
      skipEmptyLines:false,
      complete:(res)=>procesarFilasPlanner(res.data)
    });
  } else if (ext === 'txt'){
    Papa.parse(file,{
      header:false,
      skipEmptyLines:false,
      delimiter:'\t',
      complete:(res)=>procesarFilasPlanner(res.data)
    });
  } else if (ext === 'xls' || ext === 'xlsx'){
    const reader = new FileReader();
    reader.onload = (e)=>{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data,{type:'array'});
      const firstSheet = wb.SheetNames[0];
      const ws = wb.Sheets[firstSheet];
      const json = XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      procesarFilasPlanner(json);
    };
    reader.readAsArrayBuffer(file);
  } else {
    alert('Formato no soportado. Usa CSV, TXT, XLS o XLSX.');
  }
}

/* Utilidades */
function obtenerLetraDiaDesdeFecha(fechaStr){
  if (!fechaStr) return '';
  fechaStr = fechaStr.toString().trim().replace(/[.-]/g,'/');
  const partes = fechaStr.split('/');
  if (partes.length !== 3) return '';
  const d = parseInt(partes[0],10);
  const m = parseInt(partes[1],10) - 1;
  const y = parseInt(partes[2],10);
  if (isNaN(d) || isNaN(m) || isNaN(y)) return '';
  const dt = new Date(y,m,d);
  if (isNaN(dt.getTime())) return '';
  const jsDay = dt.getDay();
  switch(jsDay){
    case 1: return 'L';
    case 2: return 'M';
    case 3: return 'X';
    case 4: return 'J';
    case 5: return 'V';
    case 6: return 'S';
    case 0: return 'D';
    default: return '';
  }
}

function encontrarInicioDatos(rows){
  for (let i=0;i<rows.length;i++){
    const row = rows[i];
    const canal = (row[2] || '').toString().trim();
    const codigo = (row[6] || '').toString().trim();
    const fechaEntrega = (row[17] || '').toString().trim();
    if (canal && codigo && fechaEntrega){
      return i;
    }
  }
  return 1;
}

/* Procesar planner */
function procesarFilasPlanner(rows){
  const tbody = document.querySelector('#result-table tbody');
  tbody.innerHTML = '';

  ultimosValoresTabla = [];
  markersByCodigo.clear();
  capaFSE.clearLayers();
  capaDetEnRuta.clearLayers();
  capaDetFueraRuta.clearLayers();

  const agregadosFueraRuta = new Map();
  const clientesDetEnRuta = [];
  const clientesFSE = [];
  const startIdx = encontrarInicioDatos(rows);
  const bounds = [];
  const fechasEntrega = [];

  for (let i=startIdx;i<rows.length;i++){
    const row = rows[i];
    if (!row) continue;

    const canal = (row[2] || '').toString().trim();
    if (!canal) continue;

    const rutaVentas    = (row[3] || '').toString().trim();
    const codigo        = (row[6] || '').toString().trim();
    const clienteNombre = (row[7] || '').toString().trim();
    if (!codigo) continue;

    const fechaEntregaRaw = (row[17] || '').toString().trim();
    if (fechaEntregaRaw) fechasEntrega.push(fechaEntregaRaw);
    const letraDiaEntrega = obtenerLetraDiaDesdeFecha(fechaEntregaRaw);
    const filaSigma = sigmaByDeudor.get(codigo);
    const kgStr = (row[18] || '0').toString().replace(',','.');
    const kg = parseFloat(kgStr) || 0;

    let lat = NaN;
    let lon = NaN;
    if (filaSigma){
      lat = parseFloat((filaSigma[COL_LAT] || '').toString().replace(',','.'));
      lon = parseFloat((filaSigma[COL_LON] || '').toString().replace(',','.'));
    }
    const tieneGeo = !isNaN(lat) && !isNaN(lon);

    /* FSE */
    if (canal.includes('FSE')){
      clientesFSE.push({canal,codigo,cliente:clienteNombre,lat,lon,tieneGeo});
      if (tieneGeo){
        const popupHtml =
          `<div style="font-size:10px;"><strong>${codigo}</strong> - ${clienteNombre}</div>`;
        const mFse = L.circleMarker([lat,lon],{
          radius:5,
          color:'#1d4ed8',
          fillColor:'#3b82f6',
          fillOpacity:0.9
        }).addTo(capaFSE).bindPopup(popupHtml);
        markersByCodigo.set(codigo,mFse);
        bounds.push([lat,lon]);
      }
      continue;
    }

    /* DET */
    if (!canal.includes('DET') || !filaSigma || !letraDiaEntrega) continue;

    let diasDespacho = (filaSigma[48] || '').toString();
    diasDespacho = diasDespacho.toUpperCase().replace(/s+/g,'').trim();
    if (!diasDespacho) continue;

    const enRuta = diasDespacho.indexOf(letraDiaEntrega) >= 0;

    if (enRuta){
      clientesDetEnRuta.push({
        canal,
        codigo,
        cliente: clienteNombre,
        ruta: rutaVentas,
        fechaEntrega: fechaEntregaRaw,
        letraEntrega: letraDiaEntrega,
        diaDespacho: diasDespacho,
        kg,
        lat,
        lon,
        tieneGeo
      });
      if (tieneGeo){
        const popupHtml =
          `<div style="font-size:10px;"><strong>${codigo}</strong> - ${clienteNombre}<br>`+
          `Día despacho: ${diasDespacho}</div>`;
        const mDetOk = L.circleMarker([lat,lon],{
          radius:5,
          color:'#a16207',
          fillColor:'#facc15',
          fillOpacity:0.9
        }).addTo(capaDetEnRuta).bindPopup(popupHtml);
        if (!markersByCodigo.has(codigo)){
          markersByCodigo.set(codigo,mDetOk);
        }
        bounds.push([lat,lon]);
      }
    } else {
      let item = agregadosFueraRuta.get(codigo);
      if (!item){
        item = {
          canal,
          codigo,
          cliente: clienteNombre,
          ruta: rutaVentas,
          fechaEntrega: fechaEntregaRaw,
          letraEntrega: letraDiaEntrega,
          diaDespacho: diasDespacho,
          kg: 0,
          lat,
          lon,
          tieneGeo
        };
        agregadosFueraRuta.set(codigo,item);
      }
      item.kg += kg;
    }
  }

  const valoresFueraRuta = Array.from(agregadosFueraRuta.values()).sort((a,b)=>a.kg-b.kg);
  ultimosValoresTabla = valoresFueraRuta;

  valoresFueraRuta.forEach(item=>{
    const tr = document.createElement('tr');
    tr.dataset.codigo = item.codigo;
    tr.innerHTML = `
      <td>${item.canal}</td>
      <td>${item.codigo}</td>
      <td>${item.cliente}</td>
      <td>${item.ruta}</td>
      <td>${item.diaDespacho}</td>
      <td>${item.kg.toFixed(3)}</td>
    `;
    document.querySelector('#result-table tbody').appendChild(tr);

    if (item.tieneGeo){
      const popupHtml =
        `<div style="font-size:10px;"><strong>${item.codigo}</strong> - ${item.cliente}<br>`+
        `Día despacho: ${item.diaDespacho}</div>`;
      const mDetBad = L.circleMarker([item.lat,item.lon],{
        radius:6,
        color:'#b91c1c',
        fillColor:'#ef4444',
        fillOpacity:0.9
      }).addTo(capaDetFueraRuta).bindPopup(popupHtml);
      markersByCodigo.set(item.codigo,mDetBad);
      bounds.push([item.lat,item.lon]);
    }
  });

  if (bounds.length){
    mapa.fitBounds(bounds,{padding:[20,20]});
  }

  enlazarFilasYMarcadores();

  document.getElementById('table-panel').style.display = 'flex';

  let fechaTexto = '-';
  if (fechasEntrega.length){
    const f = fechasEntrega[0];             // planner de un solo día
    const letra = obtenerLetraDiaDesdeFecha(f);
    fechaTexto = `${f} (${letra})`;         // ej: 02.01.2026 (V)
  }
  document.getElementById('results-summary').textContent =
    `Clientes DET fuera de ruta: ${valoresFueraRuta.length} | Fecha: ${fechaTexto}`;
}

/* Enlace tabla <-> mapa */
function enlazarFilasYMarcadores(){
  const filas = document.querySelectorAll('#result-table tbody tr');
  filas.forEach(tr=>{
    const codigo = tr.dataset.codigo;
    const marker = markersByCodigo.get(codigo);
    if (!marker) return;

    tr.addEventListener('mouseenter', ()=>{
      tr.classList.add('highlight-row');
      marker.setStyle({radius:9, weight:3});
      marker.bringToFront();
    });
    tr.addEventListener('mouseleave', ()=>{
      tr.classList.remove('highlight-row');
      marker.setStyle({radius:6, weight:1});
    });

    marker.on('mouseover', ()=>{
      tr.classList.add('highlight-row');
    });
    marker.on('mouseout', ()=>{
      tr.classList.remove('highlight-row');
    });

    tr.addEventListener('click', ()=>{
      if (marker.getLatLng){
        mapa.setView(marker.getLatLng(), 14);
        marker.openPopup();
      }
    });

    marker.on('click', ()=>{
      filas.forEach(f=>f.classList.remove('highlight-row'));
      tr.classList.add('highlight-row');
    });
  });
}

/* Botones exportación */
function configurarEventosTabla(){
  document.getElementById('btnCsv').addEventListener('click', descargarCSV);
  document.getElementById('btnCopyTable').addEventListener('click', copiarTablaExcel);
  document.getElementById('btnCopyImage').addEventListener('click', copiarTablaImagen);
}

function descargarCSV(){
  if (!ultimosValoresTabla.length){
    alert('No hay datos para exportar.');
    return;
  }
  const headers = ['Canal','Código','Cliente','Ruta ventas','Día despacho','Kg pedido'];
  const filas = ultimosValoresTabla.map(it=>[
    it.canal,
    it.codigo,
    it.cliente,
    it.ruta,
    it.diaDespacho,
    it.kg.toFixed(3)
  ]);
  const todo = [headers].concat(filas);
  const csv = todo.map(r=>r.map(val=>{
    const s = (val==null?'':val.toString());
    if (s.includes(',') || s.includes('"') || s.includes('\n')){
      return '"' + s.replace(/"/g,'""') + '"';
    }
    return s;
  }).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'clientes_fuera_ruta.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function copiarTablaExcel(){
  const table = document.getElementById('result-table');
  if (!table) return;

  let texto = '';
  const rows = table.querySelectorAll('tr');
  rows.forEach((tr,idx)=>{
    const cells = tr.querySelectorAll(idx===0 ? 'th' : 'td');
    const linea = Array.from(cells).map(td=>td.textContent.trim()).join('\t');
    texto += linea + '\n';
  });

  navigator.clipboard.writeText(texto).then(()=>{
    alert('Tabla copiada. Pega en Excel con Ctrl+V.');
  }).catch(()=>{
    alert('No se pudo copiar al portapapeles.');
  });
}

function copiarTablaImagen(){
  const table = document.getElementById('result-table');
  if (!table) return;

  const cloneWrapper = document.createElement('div');
  cloneWrapper.style.position = 'fixed';
  cloneWrapper.style.left = '-9999px';
  cloneWrapper.style.top = '0';
  cloneWrapper.style.background = '#ffffff';

  const cloneTable = table.cloneNode(true);
  cloneWrapper.appendChild(cloneTable);
  document.body.appendChild(cloneWrapper);

  const rect = cloneTable.getBoundingClientRect();
  const scale = window.devicePixelRatio || 1;

  const canvas = document.createElement('canvas');
  canvas.width = rect.width * scale;
  canvas.height = rect.height * scale;
  const ctx = canvas.getContext('2d');

  ctx.scale(scale,scale);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,rect.width,rect.height);

  const rows = cloneTable.querySelectorAll('tr');
  const rowHeight = 18;
  const headerBg = '#111827';
  const headerTextColor = '#f9fafb';
  const bodyEvenBg = '#f3f4f6';
  const bodyOddBg = '#ffffff';

  const colWidths = [];
  const headerCells = cloneTable.querySelectorAll('thead th');
  headerCells.forEach((th,i)=>{
    colWidths[i] = Math.max(80, th.getBoundingClientRect().width);
  });

  let y = rowHeight;
  rows.forEach((tr,rowIndex)=>{
    const cells = tr.querySelectorAll(rowIndex===0 ? 'th' : 'td');

    ctx.fillStyle = (rowIndex===0) ? headerBg : (rowIndex % 2 === 0 ? bodyEvenBg : bodyOddBg);
    ctx.fillRect(0,y-rowHeight,rect.width,rowHeight);

    ctx.font = '11px Segoe UI, sans-serif';
    ctx.fillStyle = (rowIndex===0) ? headerTextColor : '#111827';

    let x = 4;
    cells.forEach((td,colIndex)=>{
      const text = td.textContent.trim();
      ctx.fillText(text,x,y-5);
      x += (colWidths[colIndex] || 80);
    });
    y += rowHeight;
  });

  document.body.removeChild(cloneWrapper);

  canvas.toBlob(blob=>{
    if (!blob){
      alert('No se pudo generar la imagen.');
      return;
    }
    const item = new ClipboardItem({'image/png': blob});
    navigator.clipboard.write([item]).then(()=>{
      alert('Imagen de tabla copiada. Pega con Ctrl+V.');
    }).catch(()=>{
      alert('No se pudo copiar la imagen al portapapeles.');
    });
  },'image/png');
}

/* Captura de mapa con html2canvas (incluye leyenda) */
function copiarMapaImagen(){
  const mapPanel = document.getElementById('mapPanel');
  if (!mapPanel){
    alert('No se encontró el panel del mapa.');
    return;
  }

  html2canvas(mapPanel,{
    useCORS:true,
    logging:false,
    scale:window.devicePixelRatio || 1
  }).then(canvas=>{
    canvas.toBlob(blob=>{
      if (!blob){
        alert('No se pudo generar la imagen del mapa.');
        return;
      }
      const item = new ClipboardItem({'image/png': blob});
      navigator.clipboard.write([item]).then(()=>{
        alert('Imagen del mapa copiada. Pega con Ctrl+V.');
      }).catch(()=>{
        alert('No se pudo copiar la imagen del mapa al portapapeles.');
      });
    },'image/png');
  }).catch(()=>{
    alert('No se pudo capturar el mapa.');
  });
}
