<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - Filtros Planning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/RoadMap/main/MapTrack.png" />

  <!-- Librerías -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root{
      --sidebar-accent:#f9735b;
      --main-bg:#f4f5f7;
      --card-bg:#ffffff;
      --border-soft:#e5e7eb;
      --text-main:#111827;
      --text-muted:#6b7280;
      --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      --content-max:1120px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font);
      background:var(--main-bg);
      color:var(--text-main);
      min-height:100vh;
      margin:0;
    }
    .layout{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    .main{
      flex:1;
      padding:72px 12px 12px;
      display:flex;
      justify-content:center;
    }
    .main-inner{
      width:100%;
      max-width:var(--content-max);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .panel{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
      background:var(--card-bg);
      border-radius:14px;
      padding:14px 14px 16px;
      border:1px solid var(--border-soft);
      box-shadow:0 6px 20px rgba(15,23,42,0.08);
      min-height:0;
    }
    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
    }
    .panel-title h1{
      font-size:18px;
      margin-bottom:4px;
    }
    .panel-title p{
      font-size:12px;
      color:var(--text-muted);
    }
    .panel-meta{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:4px;
      font-size:11px;
    }

    .uploader-box{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:8px;
      padding:10px;
      border-radius:10px;
      border:1px solid var(--border-soft);
      background:#f9fafb;
      font-size:12px;
    }
    .uploader-box label{
      font-weight:600;
      color:#4b5563;
    }
    .uploader-box input[type="file"]{
      font-size:12px;
    }
    .btn{
      border:none;
      border-radius:999px;
      padding:6px 12px;
      font-size:12px;
      cursor:pointer;
      font-weight:600;
      white-space:nowrap;
    }
    .btn-primary{
      background:var(--sidebar-accent);
      color:#111827;
    }
    .btn-secondary{
      background:#e5e7eb;
      color:#111827;
    }
    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status-text{
      font-size:11px;
      color:var(--text-muted);
    }

    .results-summary{
      font-size:12px;
      color:var(--text-muted);
    }

    /* Recuadro tabla + botones */
    .table-panel{
      border-radius:10px;
      border:1px solid var(--border-soft);
      padding:8px;
      background:#f9fafb;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .table-actions{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      justify-content:flex-end;
    }

    .table-wrapper{
      border-radius:8px;
      border:1px solid var(--border-soft);
      overflow:auto;
      max-height:60vh;
      background:#ffffff;
    }
    table{
      width:100%;
      border-collapse:collapse;
      font-size:11px;
    }
    thead{
      position:sticky;
      top:0;
      background:#111827;
      color:#f9fafb;
      z-index:1;
    }
    th,td{
      padding:4px 6px;
      border-bottom:1px solid #e5e7eb;
      text-align:left;
      white-space:nowrap;
    }
    tbody tr:nth-child(even){
      background:#f3f4f6;
    }
  </style>
</head>

<body>
<div class="layout">
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="main-inner">
      <section class="panel">
        <header class="panel-header">
          <div class="panel-title">
            <h1>Filtros Planning</h1>
            <p>Sube el archivo del planner y cruza los clientes con el catálogo Sigma.</p>
          </div>
          <div class="panel-meta">
            <span class="status-text" id="status-text">Catálogo Sigma: cargando…</span>
          </div>
        </header>

        <div class="uploader-box">
          <label for="plannerFile">Archivo Planner (.csv, .txt, .xls, .xlsx):</label>
          <input type="file" id="plannerFile" accept=".csv,.txt,.xls,.xlsx" />
          <button class="btn btn-primary" id="btnProcesar" disabled>Procesar</button>
        </div>

        <div class="results-summary" id="results-summary"></div>

        <!-- Recuadro de tabla + botones -->
        <div class="table-panel" id="table-panel" style="display:none;">
          <div class="table-actions">
            <button class="btn btn-secondary" id="btnCsv">Descargar CSV</button>
            <button class="btn btn-secondary" id="btnCopyTable">Copiar como tabla Excel</button>
            <button class="btn btn-secondary" id="btnCopyImage">Copiar como imagen</button>
          </div>

          <div class="table-wrapper" id="table-wrapper">
            <table id="result-table">
              <thead>
                <tr>
                  <th>Canal</th>
                  <th>Código</th>
                  <th>Cliente</th>
                  <th>Ruta ventas</th>
                  <th>Fecha entrega (PREVIA)</th>
                  <th>Día despacho</th>
                  <th>Kg pedido</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
const SIGMA_CSV_URL = 'https://raw.githubusercontent.com/Gokzarag/MapTrack/main/Catalogo%20Sigma.csv';
const DEBUG = false;

let sigmaByDeudor = new Map(); // deudor -> fila catálogo
let ultimosValoresTabla = [];  // para exportar

document.addEventListener('DOMContentLoaded', ()=>{
  if (typeof loadSidebar === 'function') {
    loadSidebar('planner');
  }
  cargarCatalogoSigma();
  configurarEventosTabla();
  configurarEventos();
});

function cargarCatalogoSigma(){
  const status = document.getElementById('status-text');
  status.textContent = 'Catálogo Sigma: cargando…';

  Papa.parse(SIGMA_CSV_URL,{
    download:true,
    header:false,
    skipEmptyLines:true,
    complete:(res)=>{
      sigmaByDeudor.clear();
      res.data.forEach(row=>{
        const deudor = (row[0] || '').toString().trim(); // código cliente
        if (deudor){
          sigmaByDeudor.set(deudor,row);
        }
      });
      status.textContent = `Catálogo Sigma: ${sigmaByDeudor.size} clientes cargados.`;
      if (DEBUG) console.log('Sigma cargado, filas:', res.data.length);
      habilitarBotonProcesar();
    },
    error:(err)=>{
      console.error('Error catálogo Sigma',err);
      status.textContent = 'Error cargando catálogo Sigma.';
    }
  });
}

function configurarEventos(){
  const fileInput   = document.getElementById('plannerFile');
  fileInput.addEventListener('change', habilitarBotonProcesar);

  document.getElementById('btnProcesar').addEventListener('click', ()=>{
    const file = fileInput.files && fileInput.files[0];
    if (!file){
      alert('Selecciona un archivo del planner.');
      return;
    }
    procesarArchivoPlanner(file);
  });
}

function habilitarBotonProcesar(){
  const fileInput = document.getElementById('plannerFile');
  const btn = document.getElementById('btnProcesar');
  const ok = sigmaByDeudor.size > 0 && fileInput.files.length > 0;
  btn.disabled = !ok;
}

function procesarArchivoPlanner(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if (DEBUG) console.log('Procesando archivo', file.name, 'ext=', ext);

  if (ext === 'csv'){
    Papa.parse(file,{
      header:false,
      skipEmptyLines:false,
      complete:(res)=>procesarFilasPlanner(res.data)
    });
  } else if (ext === 'txt'){
    Papa.parse(file,{
      header:false,
      skipEmptyLines:false,
      delimiter:'\t', // PREVIA.TXT es tabulado
      complete:(res)=>procesarFilasPlanner(res.data)
    });
  } else if (ext === 'xls' || ext === 'xlsx'){
    const reader = new FileReader();
    reader.onload = (e)=>{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data,{type:'array'});
      const firstSheet = wb.SheetNames[0];
      const ws = wb.Sheets[firstSheet];
      const json = XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      procesarFilasPlanner(json);
    };
    reader.readAsArrayBuffer(file);
  } else {
    alert('Formato no soportado. Usa CSV, TXT, XLS o XLSX.');
  }
}

// Convierte la fecha dd.mm.yyyy o dd/mm/yyyy a letra de día (L,M,X,J,V,S)
function obtenerLetraDiaDesdeFecha(fechaStr){
  if (!fechaStr) return '';
  fechaStr = fechaStr.toString().trim().replace(/[.-]/g,'/');
  const partes = fechaStr.split('/');
  if (partes.length !== 3) return '';
  const d = parseInt(partes[0],10);
  const m = parseInt(partes[1],10) - 1;
  const y = parseInt(partes[2],10);
  if (isNaN(d) || isNaN(m) || isNaN(y)) return '';
  const dt = new Date(y,m,d);
  if (isNaN(dt.getTime())) return '';
  const jsDay = dt.getDay(); // 0=Dom,1=Lun,2=Mar,3=Mié,4=Jue,5=Vie,6=Sab
  switch(jsDay){
    case 1: return 'L';
    case 2: return 'M';
    case 3: return 'X';
    case 4: return 'J';
    case 5: return 'V';
    case 6: return 'S';
    default: return '';
  }
}

function encontrarInicioDatos(rows){
  for (let i=0;i<rows.length;i++){
    const row = rows[i];
    const canal = (row[2] || '').toString().trim();   // Canal (Come)
    const codigo = (row[6] || '').toString().trim();  // Cliente
    const fechaEntrega = (row[17] || '').toString().trim(); // Fe.entrega
    if (canal && codigo && fechaEntrega){
      return i;
    }
  }
  return 1;
}

function procesarFilasPlanner(rows){
  const tbody = document.querySelector('#result-table tbody');
  tbody.innerHTML = '';

  const agregados = new Map();
  const startIdx = encontrarInicioDatos(rows);

  if (DEBUG) console.log('Inicio datos en fila:', startIdx);

  for (let i=startIdx;i<rows.length;i++){
    const row = rows[i];
    if (!row) continue;

    const canal = (row[2] || '').toString().trim();      // Canal (Come)
    if (!canal || !canal.includes('DET')) continue;

    const rutaVentas    = (row[3] || '').toString().trim(); // Ruta
    const codigo        = (row[6] || '').toString().trim(); // Cliente
    const clienteNombre = (row[7] || '').toString().trim(); // Nombre cliente
    if (!codigo) continue;

    const fechaEntregaRaw = (row[17] || '').toString();     // Fe.entrega (PREVIA)
    const letraDiaEntrega = obtenerLetraDiaDesdeFecha(fechaEntregaRaw);
    if (!letraDiaEntrega) continue;

    const filaSigma = sigmaByDeudor.get(codigo);
    if (!filaSigma) continue;

    let diasDespacho = (filaSigma[48] || '').toString(); // FV Z3
    diasDespacho = diasDespacho.toUpperCase().replace(/s+/g,'').trim();
    if (!diasDespacho) continue;

    const enRuta = diasDespacho.indexOf(letraDiaEntrega) >= 0;
    if (enRuta) {
      continue; // Programar -> no se muestra
    }

    const kgStr = (row[18] || '0').toString().replace(',','.');
    const kg = parseFloat(kgStr) || 0;

    let item = agregados.get(codigo);
    if (!item){
      item = {
        canal,
        codigo,
        cliente: clienteNombre,
        ruta: rutaVentas,
        fechaEntrega: fechaEntregaRaw,
        letraEntrega: letraDiaEntrega,
        diaDespacho: diasDespacho,
        kg: 0
      };
      agregados.set(codigo,item);
    }
    item.kg += kg;
  }

  // Ordenar ascendente por Kg pedido
  const valores = Array.from(agregados.values()).sort((a,b)=>a.kg-b.kg);
  ultimosValoresTabla = valores;

  valores.forEach(item=>{
    const fechaConLetra = `${item.fechaEntrega} (${item.letraEntrega})`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.canal}</td>
      <td>${item.codigo}</td>
      <td>${item.cliente}</td>
      <td>${item.ruta}</td>
      <td>${fechaConLetra}</td>
      <td>${item.diaDespacho}</td>
      <td>${item.kg.toFixed(3)}</td>
    `;
    tbody.appendChild(tr);
  });

  const summary = document.getElementById('results-summary');
  document.getElementById('table-panel').style.display = 'flex';
  summary.textContent = `Clientes DET fuera de ruta encontrados: ${valores.length}.`;
}

/* ---------- BOTONES DE EXPORTACIÓN / COPIAR ---------- */

function configurarEventosTabla(){
  document.getElementById('btnCsv').addEventListener('click', descargarCSV);
  document.getElementById('btnCopyTable').addEventListener('click', copiarTablaExcel);
  document.getElementById('btnCopyImage').addEventListener('click', copiarTablaImagen);
}

// Genera CSV descargable desde ultimosValoresTabla
function descargarCSV(){
  if (!ultimosValoresTabla.length){
    alert('No hay datos para exportar.');
    return;
  }
  const headers = ['Canal','Código','Cliente','Ruta ventas','Fecha entrega (PREVIA)','Día despacho','Kg pedido'];
  const filas = ultimosValoresTabla.map(it=>[
    it.canal,
    it.codigo,
    it.cliente,
    it.ruta,
    `${it.fechaEntrega} (${it.letraEntrega})`,
    it.diaDespacho,
    it.kg.toFixed(3)
  ]);
  const todo = [headers].concat(filas);
  const csv = todo.map(r=>r.map(val=>{
    const s = (val==null?'':val.toString());
    if (s.includes(';') || s.includes('"') || s.includes('\n')){
      return '"' + s.replace(/"/g,'""') + '"';
    }
    return s;
  }).join(';')).join('\n'); // separador ; para Excel
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'clientes_fuera_ruta.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Copia tabla en formato tabular compatible con pegar en Excel
function copiarTablaExcel(){
  const table = document.getElementById('result-table');
  if (!table) return;

  let texto = '';
  const rows = table.querySelectorAll('tr');
  rows.forEach((tr,idx)=>{
    const cells = tr.querySelectorAll(idx===0 ? 'th' : 'td');
    const linea = Array.from(cells).map(td=>td.textContent.trim()).join('\t');
    texto += linea + '
';
  });

  navigator.clipboard.writeText(texto).then(()=>{
    alert('Tabla copiada. Pega en Excel con Ctrl+V.');
  }).catch(()=>{
    alert('No se pudo copiar al portapapeles.');
  });
}

// Copia la tabla como imagen usando canvas
function copiarTablaImagen(){
  const tableWrapper = document.getElementById('table-wrapper');
  if (!tableWrapper) return;

  const rect = tableWrapper.getBoundingClientRect();
  const scale = window.devicePixelRatio || 1;

  const canvas = document.createElement('canvas');
  canvas.width = rect.width * scale;
  canvas.height = rect.height * scale;
  const ctx = canvas.getContext('2d');

  ctx.scale(scale,scale);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,rect.width,rect.height);

  // Render sencillo: texto por celdas (no perfecto pero suficiente)
  const table = document.getElementById('result-table');
  const rows = table.querySelectorAll('tr');
  const rowHeight = 18;
  const colWidths = [];
  const cols = table.querySelectorAll('thead th');
  cols.forEach((th,i)=>{
    colWidths[i] = Math.max(80, th.getBoundingClientRect().width);
  });

  ctx.font = '11px Segoe UI, sans-serif';
  ctx.fillStyle = '#111827';

  let y = rowHeight;
  rows.forEach((tr,rowIndex)=>{
    const cells = tr.querySelectorAll(rowIndex===0 ? 'th' : 'td');
    let x = 4;
    cells.forEach((td,colIndex)=>{
      const text = td.textContent.trim();
      ctx.fillText(text,x,y);
      x += (colWidths[colIndex] || 80);
    });
    y += rowHeight;
  });

  canvas.toBlob(blob=>{
    if (!blob){
      alert('No se pudo generar la imagen.');
      return;
    }
    const item = new ClipboardItem({'image/png': blob});
    navigator.clipboard.write([item]).then(()=>{
      alert('Imagen copiada. Pega en documentos o chats (Ctrl+V).');
    }).catch(()=>{
      alert('No se pudo copiar la imagen al portapapeles.');
    });
  },'image/png');
}
</script>

<script src="layout.js"></script>
</body>
</html>
