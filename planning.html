<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap - Filtros Planning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="https://raw.githubusercontent.com/Gokzarag/MapTrack/main/MapTrack.png" />

  <!-- Librerías -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    :root{
      --sidebar-accent:#f9735b;
      --main-bg:#f4f5f7;
      --card-bg:#ffffff;
      --border-soft:#e5e7eb;
      --text-main:#111827;
      --text-muted:#6b7280;
      --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font);
      background:var(--main-bg);
      color:var(--text-main);
      min-height:100vh;
      margin:0;
      font-size:12px;
    }
    .layout{display:flex;flex-direction:column;min-height:100vh;}
    .main{flex:1;padding:70px 0 4px;display:flex;justify-content:center;}
    .main-inner{width:100%;max-width:1280px;display:flex;flex-direction:column;gap:8px;}

    .panel{
      flex:1;display:flex;flex-direction:column;gap:8px;
      background:var(--card-bg);border-radius:14px;padding:12px;
      border:1px solid var(--border-soft);box-shadow:0 6px 20px rgba(15,23,42,0.08);
      min-height:0;
    }
    .panel-header{
      display:flex;justify-content:space-between;align-items:center;
      gap:8px;flex-wrap:wrap;
    }
    .panel-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .panel-title h1{font-size:16px;}
    .panel-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:10px;}

    .uploader-inline{display:flex;align-items:center;gap:4px;}
    .file-label{
      display:inline-flex;align-items:center;gap:4px;padding:3px 7px;
      border-radius:999px;border:1px solid #d1d5db;background:#ffffff;
      cursor:pointer;font-size:10px;
    }
    .file-label span.icon{font-size:12px;}
    #plannerFile{display:none;}

    .btn{
      border:none;border-radius:999px;padding:3px 7px;font-size:10px;
      cursor:pointer;font-weight:600;white-space:nowrap;
      display:inline-flex;align-items:center;justify-content:center;gap:4px;
    }
    .btn-primary{background:var(--sidebar-accent);color:#111827;}
    .btn-icon{
      background:#e5e7eb;color:#111827;width:22px;height:22px;
      border-radius:999px;padding:0;font-size:12px;
    }
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .status-text{font-size:10px;color:var(--text-muted);}

    /* Tabs */
    .tabs{display:flex;gap:4px;margin-bottom:4px;}
    .tab-button{
      border:none;border-radius:999px;padding:3px 10px;font-size:11px;
      cursor:pointer;background:#e5e7eb;
    }
    .tab-button.active{background:#111827;color:#f9fafb;}
    .tab-content{display:none;}
    .tab-content.active{display:block;}

    /* Layout Fuera de ruta */
    .content-split{
      display:flex;gap:6px;align-items:stretch;
      height:calc(100vh - 170px);
    }
    .content-left,.content-right{
      display:flex;flex-direction:column;gap:4px;min-height:0;
    }
    .content-left{flex:0.9;}
    .content-right{flex:1.9;}

    .table-panel{
      border-radius:10px;border:1px solid var(--border-soft);
      padding:4px;background:#f9fafb;display:flex;flex-direction:column;
      gap:4px;height:100%;min-height:0;font-size:9px;
    }
    .table-header-row{
      display:flex;justify-content:space-between;align-items:center;
      gap:6px;font-size:9px;color:#4b5563;
    }
    .table-actions{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;}

    .table-wrapper{
      border-radius:8px;border:1px solid var(--border-soft);
      overflow:auto;flex:1;background:#ffffff;font-size:9px;min-height:0;
    }
    table{width:100%;border-collapse:collapse;font-size:9px;}
    thead{position:sticky;top:0;background:#111827;color:#f9fafb;z-index:1;}
    th,td{padding:2px 4px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap;}
    tbody tr:nth-child(even){background:#f3f4f6;}
    tbody tr.highlight-row{
      outline:2px solid #f9735b;outline-offset:-2px;background:#fef3c7;
    }

    .map-panel{
      border-radius:10px;border:1px solid var(--border-soft);
      padding:4px;background:#f9fafb;height:100%;display:flex;
      flex-direction:column;gap:4px;min-height:0;font-size:9px;
    }
    .map-title-row{
      display:flex;justify-content:space-between;align-items:center;
      font-size:9px;color:#4b5563;
    }
    .map-legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
    .legend-item{display:inline-flex;align-items:center;gap:3px;}
    .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
    .dot-blue{background:#3b82f6;border:1px solid #1d4ed8;}
    .dot-yellow{background:#facc15;border:1px solid #a16207;}
    .dot-red{background:#ef4444;border:1px solid #b91c1c;}
    #map{flex:1;border-radius:8px;border:1px solid #e5e7eb;min-height:0;}

    @media (max-width:900px){
      .content-split{flex-direction:column;height:auto;}
      .table-wrapper,#map{min-height:260px;}
    }
  </style>
</head>

<body>
<div class="layout">
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="main-inner">
      <section class="panel">
        <header class="panel-header">
          <div class="panel-title">
            <h1>Filtros Planning</h1>
            <div class="uploader-inline">
              <label class="file-label" for="plannerFile">
                <span class="icon">📂</span>
                <span id="fileNameLabel">Seleccionar planner</span>
              </label>
              <input type="file" id="plannerFile" accept=".csv,.txt,.xls,.xlsx" />
              <button class="btn btn-primary" id="btnProcesar" disabled title="Procesar archivo">
                ▶
              </button>
            </div>
          </div>
          <div class="panel-meta">
            <span class="status-text" id="status-text">Catálogo Sigma: cargando…</span>
          </div>
        </header>

        <div class="tabs">
          <button class="tab-button active" data-tab="tab-fuera">Fuera de ruta</button>
          <button class="tab-button" data-tab="tab-duplicados">Duplicados</button>
        </div>

        <!-- Fuera de ruta -->
        <div class="tab-content active" id="tab-fuera">
          <div class="content-split">
            <div class="content-left">
              <div class="table-panel" id="table-panel" style="display:none;">
                <div class="table-header-row">
                  <span id="results-summary">Clientes DET fuera de ruta: 0 | Fecha: -</span>
                  <div class="table-actions">
                    <button class="btn btn-icon" id="btnCsv" title="Descargar CSV">💾</button>
                    <button class="btn btn-icon" id="btnCopyTable" title="Copiar como tabla Excel">📋</button>
                    <button class="btn btn-icon" id="btnCopyImage" title="Copiar tabla como imagen">🖼</button>
                  </div>
                </div>

                <div class="table-wrapper" id="table-wrapper">
                  <table id="result-table">
                    <thead>
                      <tr>
                        <th>Canal</th>
                        <th>Código</th>
                        <th>Cliente</th>
                        <th>Interlocutor</th>
                        <th>Dirección</th>
                        <th>Ruta ventas</th>
                        <th>Día despacho</th>
                        <th>Kg pedido</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="content-right">
              <div class="map-panel" id="mapPanel">
                <div class="map-title-row">
                  <div class="map-legend">
                    <span class="legend-item">
                      <span class="legend-dot dot-blue"></span><span>FSE</span>
                    </span>
                    <span class="legend-item">
                      <span class="legend-dot dot-yellow"></span><span>DET en ruta</span>
                    </span>
                    <span class="legend-item">
                      <span class="legend-dot dot-red"></span><span>DET fuera de ruta</span>
                    </span>
                  </div>
                  <div class="table-actions">
                    <button class="btn btn-icon" id="btnCopyMap" title="Copiar mapa como imagen">🖼</button>
                  </div>
                </div>
                <div id="map"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Duplicados -->
        <div class="tab-content" id="tab-duplicados">
          <div class="table-panel">
            <div class="table-header-row">
              <span id="dup-summary">Pedidos duplicados: 0</span>
            </div>
            <div class="table-wrapper">
              <table id="dup-table">
                <thead>
                  <tr>
                    <th>Código</th>
                    <th>Cliente</th>
                    <th>Ruta</th>
                    <th>Pedido(s)</th>
                    <th>Cod Material</th>
                    <th>Material</th>
                    <th>Kg</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

      </section>
    </div>
  </main>
</div>
<script>
const SIGMA_CSV_URL = 'https://raw.githubusercontent.com/Gokzarag/MapTrack/main/Catalogo%20Sigma.csv';
const COL_LAT = 28;
const COL_LON = 29;

let sigmaByDeudor = new Map();
let ultimosValoresTabla = [];
let mapa = null;
let capaFSE = null;
let capaDetEnRuta = null;
let capaDetFueraRuta = null;
let markersByCodigo = new Map();

document.addEventListener('DOMContentLoaded', ()=>{
  if (typeof loadSidebar === 'function') {
    loadSidebar('planner');
  }
  initTabs();
  initMapa();
  cargarCatalogoSigma();
  configurarEventosTabla();
  configurarEventos();
});

/* Tabs */
function initTabs(){
  const btns = document.querySelectorAll('.tab-button');
  const tabs = document.querySelectorAll('.tab-content');
  btns.forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id = btn.dataset.tab;
      btns.forEach(b=>b.classList.remove('active'));
      tabs.forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(id).classList.add('active');
    });
  });
}

/* Mapa */
function initMapa(){
  mapa = L.map('map').setView([-12.0464, -77.0428], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap'
  }).addTo(mapa);
  capaFSE = L.layerGroup().addTo(mapa);
  capaDetEnRuta = L.layerGroup().addTo(mapa);
  capaDetFueraRuta = L.layerGroup().addTo(mapa);
}

/* Catálogo Sigma */
function cargarCatalogoSigma(){
  const status = document.getElementById('status-text');
  status.textContent = 'Catálogo Sigma: cargando…';

  Papa.parse(SIGMA_CSV_URL,{
    download:true,
    header:false,
    skipEmptyLines:true,
    complete:(res)=>{
      sigmaByDeudor.clear();
      res.data.forEach(row=>{
        const deudor = (row[0] || '').toString().trim();
        if (deudor){
          sigmaByDeudor.set(deudor,row);
        }
      });
      status.textContent = `Catálogo Sigma: ${sigmaByDeudor.size} clientes cargados.`;
      habilitarBotonProcesar();
    },
    error:()=>{
      status.textContent = 'Error cargando catálogo Sigma.';
    }
  });
}

/* Eventos generales */
function configurarEventos(){
  const fileInput   = document.getElementById('plannerFile');
  const fileNameLabel = document.getElementById('fileNameLabel');

  fileInput.addEventListener('change', ()=>{
    fileNameLabel.textContent = fileInput.files && fileInput.files[0]
      ? fileInput.files[0].name
      : 'Seleccionar planner';
    habilitarBotonProcesar();
  });

  document.getElementById('btnProcesar').addEventListener('click', ()=>{
    const file = fileInput.files && fileInput.files[0];
    if (!file){
      alert('Selecciona un archivo del planner.');
      return;
    }
    procesarArchivoPlanner(file);
  });

  document.getElementById('btnCopyMap').addEventListener('click', copiarMapaImagen);
}

function habilitarBotonProcesar(){
  const fileInput = document.getElementById('plannerFile');
  const btn = document.getElementById('btnProcesar');
  btn.disabled = !(sigmaByDeudor.size > 0 && fileInput.files.length > 0);
}

function procesarArchivoPlanner(file){
  const ext = file.name.split('.').pop().toLowerCase();

  if (ext === 'csv'){
    Papa.parse(file,{header:false,skipEmptyLines:false,complete:r=>procesarFilasPlanner(r.data)});
  } else if (ext === 'txt'){
    Papa.parse(file,{header:false,skipEmptyLines:false,delimiter:'\t',complete:r=>procesarFilasPlanner(r.data)});
  } else if (ext === 'xls' || ext === 'xlsx'){
    const reader = new FileReader();
    reader.onload = e=>{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data,{type:'array', cellDates:false});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
      procesarFilasPlanner(json);
    };
    reader.readAsArrayBuffer(file);
  } else {
    alert('Formato no soportado. Usa CSV, TXT, XLS o XLSX.');
  }
}

/* Fechas */
function obtenerLetraDiaDesdeFecha(fechaStr){
  if (!fechaStr) return '';
  const limpia = fechaStr.toString().trim().replace(/[.-]/g,'/');
  const partes = limpia.split('/');
  if (partes.length !== 3) return '';
  const d = parseInt(partes[0],10);
  const m = parseInt(partes[1],10) - 1;
  const y = parseInt(partes[2],10);
  const dt = new Date(y,m,d);
  if (isNaN(dt.getTime())) return '';
  const jsDay = dt.getDay();
  return ['D','L','M','X','J','V','S'][jsDay];
}

function excelSerialToDateString(serial){
  if (serial == null || serial === '') return '';
  const n = Number(serial);
  if (!Number.isFinite(n)) return '';
  const days = Math.floor(n);
  const excelEpoch = new Date(1899,11,30);
  const ms = days * 24 * 60 * 60 * 1000;
  const dt = new Date(excelEpoch.getTime() + ms);
  if (isNaN(dt.getTime())) return '';
  const dd = String(dt.getDate()).padStart(2,'0');
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const yyyy = dt.getFullYear();
  return `${dd}.${mm}.${yyyy}`;
}

function normalizarFechaPlanner(valor){
  if (valor == null) return '';
  if (valor instanceof Date){
    const dd = String(valor.getDate()).padStart(2,'0');
    const mm = String(valor.getMonth()+1).padStart(2,'0');
    const yyyy = valor.getFullYear();
    return `${dd}.${mm}.${yyyy}`;
  }
  const str = valor.toString().trim();
  if (!str) return '';
  if (str.includes('.') || str.includes('/') || str.includes('-')){
    return str.replace(/[/-]/g,'.');
  }
  if (/^d+(.d+)?$/.test(str)){
    return excelSerialToDateString(str);
  }
  return str;
}

function encontrarInicioDatos(rows){
  for (let i=0;i<rows.length;i++){
    const row = rows[i];
    const canal = (row[2] || '').toString().trim();
    const codigo = (row[6] || '').toString().trim();
    const fechaEntrega = normalizarFechaPlanner(row[17]);
    if (canal && codigo && fechaEntrega){
      return i;
    }
  }
  return 1;
}

/* Procesar planner */
function procesarFilasPlanner(rows){
  const tbody = document.querySelector('#result-table tbody');
  tbody.innerHTML = '';

  ultimosValoresTabla = [];
  markersByCodigo.clear();
  capaFSE.clearLayers();
  capaDetEnRuta.clearLayers();
  capaDetFueraRuta.clearLayers();

  const agregadosFueraRuta = new Map();
  const startIdx = encontrarInicioDatos(rows);
  const bounds = [];
  const fechasEntrega = [];

  // codCliente -> { nombre, ruta, pedidos: Map(pedido -> lineas[]) }
  const porCliente = new Map();

  for (let i=startIdx;i<rows.length;i++){
    const row = rows[i];
    if (!row) continue;

    const canal = (row[2] || '').toString().trim();
    if (!canal) continue;

    const rutaVentas    = (row[3] || '').toString().trim();
    const codCliente    = (row[6] || '').toString().trim();
    const clienteNombre = (row[7] || '').toString().trim();
    if (!codCliente) continue;

    const fechaEntregaRaw = normalizarFechaPlanner(row[17]);
    if (fechaEntregaRaw) fechasEntrega.push(fechaEntregaRaw);
    const letraDiaEntrega = obtenerLetraDiaDesdeFecha(fechaEntregaRaw);

    const filaSigma = sigmaByDeudor.get(codCliente);
    const kgStr = (row[18] || '0').toString().replace(',','.');
    const kg = parseFloat(kgStr) || 0;

    let lat = NaN, lon = NaN, interlocutor = '', direccion = '';
    if (filaSigma){
      lat = parseFloat((filaSigma[COL_LAT] || '').toString().replace(',','.'));
      lon = parseFloat((filaSigma[COL_LON] || '').toString().replace(',','.'));
      interlocutor = (filaSigma[49] || '').toString().trim();
      const tramo1 = (filaSigma[14] || '').toString().trim();
      const tramo2 = (filaSigma[17] || '').toString().trim();
      direccion = tramo1 && tramo2 ? `${tramo1} - ${tramo2}` : (tramo1 || tramo2);
    }
    const tieneGeo = !isNaN(lat) && !isNaN(lon);

    /* Duplicados: TODAS las filas, sin importar canal */
    const pedido   = (row[13] || '').toString().trim();
    const codMat   = (row[10] || '').toString().trim();
    const material = (row[11] || '').toString().trim();

    if (!porCliente.has(codCliente)){
      porCliente.set(codCliente,{
        nombre: clienteNombre,
        ruta: rutaVentas,
        pedidos: new Map()
      });
    }
    const infoCli = porCliente.get(codCliente);
    if (!infoCli.pedidos.has(pedido)){
      infoCli.pedidos.set(pedido, []);
    }
    infoCli.pedidos.get(pedido).push({codMat, material, kg});

    /* FSE para mapa */
    if (canal.includes('FSE')){
      if (tieneGeo){
        const popupHtml =
          `<div style="font-size:10px;"><strong>${codCliente}</strong> - ${clienteNombre}</div>`;
        const mFse = L.circleMarker([lat,lon],{
          radius:5,color:'#1d4ed8',fillColor:'#3b82f6',fillOpacity:0.9
        }).addTo(capaFSE).bindPopup(popupHtml);
        markersByCodigo.set(codCliente,mFse);
        bounds.push([lat,lon]);
      }
      continue;
    }

    /* DET en ruta / fuera de ruta */
    if (!canal.includes('DET') || !filaSigma || !letraDiaEntrega) continue;

    let diasDespacho = (filaSigma[48] || '').toString();
    diasDespacho = diasDespacho.toUpperCase().replace(/s+/g,'').trim();
    if (!diasDespacho) continue;

    const enRuta = diasDespacho.indexOf(letraDiaEntrega) >= 0;

    if (enRuta){
      if (tieneGeo){
        const popupHtml =
          `<div style="font-size:10px;"><strong>${codCliente}</strong> - ${clienteNombre}<br>Día despacho: ${diasDespacho}</div>`;
        const mDetOk = L.circleMarker([lat,lon],{
          radius:5,color:'#a16207',fillColor:'#facc15',fillOpacity:0.9
        }).addTo(capaDetEnRuta).bindPopup(popupHtml);
        if (!markersByCodigo.has(codCliente)){
          markersByCodigo.set(codCliente,mDetOk);
        }
        bounds.push([lat,lon]);
      }
    } else {
      let item = agregadosFueraRuta.get(codCliente);
      if (!item){
        item = {
          canal,
          codigo: codCliente,
          cliente: clienteNombre,
          ruta: rutaVentas,
          fechaEntrega: fechaEntregaRaw,
          letraEntrega: letraDiaEntrega,
          diaDespacho: diasDespacho,
          kg: 0,
          lat,
          lon,
          tieneGeo,
          interlocutor,
          direccion
        };
        agregadosFueraRuta.set(codCliente,item);
      }
      item.kg += kg;
    }
  }

  /* Tabla Fuera de ruta */
  const valoresFueraRuta = Array.from(agregadosFueraRuta.values()).sort((a,b)=>a.kg-b.kg);
  ultimosValoresTabla = valoresFueraRuta;

  valoresFueraRuta.forEach(item=>{
    const tr = document.createElement('tr');
    tr.dataset.codigo = item.codigo;
    tr.innerHTML = `
      <td>${item.canal}</td>
      <td>${item.codigo}</td>
      <td>${item.cliente}</td>
      <td>${item.interlocutor || ''}</td>
      <td>${item.direccion || ''}</td>
      <td>${item.ruta}</td>
      <td>${item.diaDespacho}</td>
      <td>${item.kg.toFixed(3)}</td>
    `;
    document.querySelector('#result-table tbody').appendChild(tr);

    if (item.tieneGeo){
      const popupHtml =
        `<div style="font-size:10px;"><strong>${item.codigo}</strong> - ${item.cliente}<br>Día despacho: ${item.diaDespacho}</div>`;
      const mDetBad = L.circleMarker([item.lat,item.lon],{
        radius:6,color:'#b91c1c',fillColor:'#ef4444',fillOpacity:0.9
      }).addTo(capaDetFueraRuta).bindPopup(popupHtml);
      markersByCodigo.set(item.codigo,mDetBad);
      bounds.push([item.lat,item.lon]);
    }
  });

  if (bounds.length){
    mapa.fitBounds(bounds,{paddingTopLeft:[10,10],paddingBottomRight:[10,10]});
    if (mapa.getZoom() > 12) mapa.setZoom(12);
  }

  enlazarFilasYMarcadores();
  document.getElementById('table-panel').style.display = 'flex';

  let fechaTexto = '-';
  if (fechasEntrega.length){
    const f = fechasEntrega[5];
    const letra = obtenerLetraDiaDesdeFecha(f);
    fechaTexto = `${f} (${letra})`;
  }
  document.getElementById('results-summary').textContent =
    `Clientes DET fuera de ruta: ${valoresFueraRuta.length} | Fecha: ${fechaTexto}`;

  /* Tabla Duplicados */
    construirTablaDuplicados(porCliente);
}

  /* Duplicados con formato “agrupado” */
function construirTablaDuplicados(porCliente){
  const tbody = document.querySelector('#dup-table tbody');
  if (!tbody) return;
  tbody.innerHTML = '';
  let gruposDuplicados = 0;

  porCliente.forEach((infoCli, codCli)=>{
    const {nombre, ruta, pedidos} = infoCli;

    // firma -> { pedidos:[], lineas[] }
    const firmaMap = new Map();

    pedidos.forEach((lineas, pedido)=>{
      // Ordenar para que el orden en el planner no afecte
      const ordenadas = [...lineas].sort((a,b)=>{
        if (a.codMat < b.codMat) return -1;
        if (a.codMat > b.codMat) return 1;
        if (a.kg < b.kg) return -1;
        if (a.kg > b.kg) return 1;
        return 0;
      });

      // Firma única por combinación codMat + material + kg
      const firma = ordenadas
        .map(l => `${l.codMat}::${l.material}::${l.kg.toFixed(3)}`)
        .join('|');

      if (!firmaMap.has(firma)){
        firmaMap.set(firma,{pedidos:[], lineas:ordenadas});
      }
      firmaMap.get(firma).pedidos.push(pedido);
    });

    // Pintar solo firmas que tienen más de un pedido (duplicados)
    firmaMap.forEach(grupo=>{
      if (grupo.pedidos.length < 2) return;

      gruposDuplicados++;
      const pedidosTexto = grupo.pedidos.join(', ');
      const lineas = grupo.lineas;

      // Recorremos todas las líneas de material del grupo
      lineas.forEach((l, idx)=>{
        const tr = document.createElement('tr');

        // Solo la primera fila del bloque lleva código/cliente/ruta/pedido(s)
        const codCol   = idx === 0 ? codCli        : '';
        const cliCol   = idx === 0 ? nombre        : '';
        const rutaCol  = idx === 0 ? ruta          : '';
        const pedCol   = idx === 0 ? pedidosTexto  : '';

        tr.innerHTML = `
          <td>${codCol}</td>
          <td>${cliCol}</td>
          <td>${rutaCol}</td>
          <td>${pedCol}</td>
          <td>${l.codMat}</td>
          <td>${l.material}</td>
          <td>${l.kg.toFixed(3)}</td>
        `;
        tbody.appendChild(tr);
      });
    });
  });

  document.getElementById('dup-summary').textContent =
    `Pedidos duplicados (grupos): ${gruposDuplicados}`;
}
/* Enlace tabla <-> mapa */
function enlazarFilasYMarcadores(){
  const filas = document.querySelectorAll('#result-table tbody tr');
  filas.forEach(tr=>{
    const codigo = tr.dataset.codigo;
    const marker = markersByCodigo.get(codigo);
    if (!marker) return;

    tr.addEventListener('mouseenter', ()=>{
      tr.classList.add('highlight-row');
      marker.setStyle({radius:9, weight:3});
      marker.bringToFront();
    });
    tr.addEventListener('mouseleave', ()=>{
      tr.classList.remove('highlight-row');
      marker.setStyle({radius:6, weight:1});
    });

    marker.on('mouseover', ()=>tr.classList.add('highlight-row'));
    marker.on('mouseout', ()=>tr.classList.remove('highlight-row'));

    tr.addEventListener('click', ()=>{
      if (marker.getLatLng){ mapa.setView(marker.getLatLng(), 14); marker.openPopup(); }
    });
    marker.on('click', ()=>{
      filas.forEach(f=>f.classList.remove('highlight-row'));
      tr.classList.add('highlight-row');
    });
  });
}

/* Exportaciones Fuera de ruta */
function configurarEventosTabla(){
  document.getElementById('btnCsv').addEventListener('click', descargarCSV);
  document.getElementById('btnCopyTable').addEventListener('click', copiarTablaExcel);
  document.getElementById('btnCopyImage').addEventListener('click', copiarTablaImagen);
}

function descargarCSV(){
  if (!ultimosValoresTabla.length){
    alert('No hay datos para exportar.');
    return;
  }
  const headers = ['Canal','Código','Cliente','Interlocutor','Dirección',
                   'Ruta ventas','Día despacho','Kg pedido'];
  const filas = ultimosValoresTabla.map(it=>[
    it.canal,it.codigo,it.cliente,it.interlocutor || '',
    it.direccion || '',it.ruta,it.diaDespacho,it.kg.toFixed(3)
  ]);
  const todo = [headers].concat(filas);
  const csv = todo.map(r=>r.map(val=>{
    const s = (val==null?'':val.toString());
    return (s.includes(',') || s.includes('"') || s.includes('\n'))
      ? '"' + s.replace(/"/g,'""') + '"'
      : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;a.download = 'clientes_fuera_ruta.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function copiarTablaExcel(){
  const table = document.getElementById('result-table');
  if (!table) return;
  let texto = '';
  const rows = table.querySelectorAll('tr');
  rows.forEach((tr,idx)=>{
    const cells = tr.querySelectorAll(idx===0 ? 'th' : 'td');
    texto += Array.from(cells).map(td=>td.textContent.trim()).join('\t') + '\n';
  });
  navigator.clipboard.writeText(texto).then(()=>{
    alert('Tabla copiada. Pega en Excel con Ctrl+V.');
  });
}

function copiarTablaImagen(){
  const table = document.getElementById('result-table');
  if (!table) return;

  const cloneWrapper = document.createElement('div');
  cloneWrapper.style.position = 'fixed';
  cloneWrapper.style.left = '-9999px';
  cloneWrapper.style.top = '0';
  cloneWrapper.style.background = '#ffffff';

  const cloneTable = table.cloneNode(true);
  cloneWrapper.appendChild(cloneTable);
  document.body.appendChild(cloneWrapper);

  const rect = cloneTable.getBoundingClientRect();
  const scale = window.devicePixelRatio || 1;
  const canvas = document.createElement('canvas');
  canvas.width = rect.width * scale;
  canvas.height = rect.height * scale;
  const ctx = canvas.getContext('2d');

  ctx.scale(scale,scale);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,rect.width,rect.height);

  const rows = cloneTable.querySelectorAll('tr');
  const rowHeight = 18;
  const headerBg = '#111827';
  const headerTextColor = '#f9fafb';
  const bodyEvenBg = '#f3f4f6';
  const bodyOddBg = '#ffffff';

  const colWidths = [];
  const headerCells = cloneTable.querySelectorAll('thead th');
  headerCells.forEach((th,i)=>{
    colWidths[i] = Math.max(80, th.getBoundingClientRect().width);
  });

  let y = rowHeight;
  rows.forEach((tr,rowIndex)=>{
    const cells = tr.querySelectorAll(rowIndex===0 ? 'th' : 'td');

    ctx.fillStyle = (rowIndex===0) ? headerBg : (rowIndex % 2 === 0 ? bodyEvenBg : bodyOddBg);
    ctx.fillRect(0,y-rowHeight,rect.width,rowHeight);

    ctx.font = '11px Segoe UI, sans-serif';
    ctx.fillStyle = (rowIndex===0) ? headerTextColor : '#111827';

    let x = 4;
    cells.forEach((td,colIndex)=>{
      ctx.fillText(td.textContent.trim(),x,y-5);
      x += (colWidths[colIndex] || 80);
    });
    y += rowHeight;
  });

  document.body.removeChild(cloneWrapper);

  canvas.toBlob(blob=>{
    if (!blob){
      alert('No se pudo generar la imagen.');
      return;
    }
    const item = new ClipboardItem({'image/png': blob});
    navigator.clipboard.write([item]).then(()=>{
      alert('Imagen de tabla copiada. Pega con Ctrl+V.');
    });
  },'image/png');
}

/* Captura de mapa */
function copiarMapaImagen(){
  const mapPanel = document.getElementById('mapPanel');
  if (!mapPanel){
    alert('No se encontró el panel del mapa.');
    return;
  }
  html2canvas(mapPanel,{
    useCORS:true,logging:false,scale:window.devicePixelRatio || 1
  }).then(canvas=>{
    canvas.toBlob(blob=>{
      if (!blob){
        alert('No se pudo generar la imagen del mapa.');
        return;
      }
      const item = new ClipboardItem({'image/png': blob});
      navigator.clipboard.write([item]).then(()=>{
        alert('Imagen del mapa copiada. Pega con Ctrl+V.');
      });
    },'image/png');
  });
}
